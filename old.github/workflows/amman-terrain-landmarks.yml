name: Adam World Amman terrain and landmark preparation
on:
  push:
    branches: [main]
    paths:
      - "tools/terrain/build_amman_dem.py"
      - ".github/workflows/amman-terrain-landmarks.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adam-world-amman-terrain
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GeoTIFF reader
        run: python -m pip install --disable-pip-version-check rasterio
      - name: Build offline Amman elevation grid
        run: python tools/terrain/build_amman_dem.py
      - name: Save terrain data immediately to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facades/cities/amman/elevation-grid.json
          git commit -m "Store Copernicus 30m Amman elevation grid" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
