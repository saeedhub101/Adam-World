name: Adam World Public Transport Route Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_public_transport_routes.py"
      - ".github/workflows/public-transport-route-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-public-transport-routes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate route importer
        run: python3 -m py_compile tools/import_public_transport_routes.py
      - name: Import mapped bus, rail and ferry route relations
        run: python3 tools/import_public_transport_routes.py
