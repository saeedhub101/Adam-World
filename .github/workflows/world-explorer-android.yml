name: World Explorer — Android CI

on:
  push:
    paths:
      - "World-Explorer/**"
      - ".github/workflows/world-explorer-android.yml"
  pull_request:
    paths:
      - "World-Explorer/**"
      - ".github/workflows/world-explorer-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-explorer-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build native Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: World-Explorer
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-explorer-debug-apk
          path: World-Explorer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
