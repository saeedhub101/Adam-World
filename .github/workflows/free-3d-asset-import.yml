name: Adam World Free 3D Asset Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_free_3d_assets.py"
      - ".github/workflows/free-3d-asset-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-free-3d-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import licensed GLB assets and checkpoint by category
        run: python3 tools/import_free_3d_assets.py
