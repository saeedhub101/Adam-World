name: Generate Manila facade windows and doors GeoJSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manila-facade-details-geojson
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry and image dependencies
        run: python -m pip install --disable-pip-version-check shapely pyproj pillow
      - name: Validate generator
        run: python -m py_compile tools/facades/generate_manila_facade_details.py
      - name: Verify canonical buildings source is committed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("data/facades/cities/manila/buildings.geojson")
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit(f"Missing canonical source: {source}")
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("type") != "FeatureCollection" or not data.get("features"):
              raise SystemExit("Canonical buildings.geojson is not a non-empty FeatureCollection")
          print(f"CANONICAL SOURCE READY: {len(data['features'])} features; {source.stat().st_size:,} bytes")
          PY
      - name: Generate window and door GeoJSON (no fabricated balconies)
        run: python -u tools/facades/generate_manila_facade_details.py
      - name: Build Panoramax-only review queue
        continue-on-error: true
        run: python -u tools/facades/build_review_queue.py --city manila --max-distance-m 100
      - name: Download Panoramax previews for manual review
        continue-on-error: true
        run: python -u tools/facades/prepare_facade_review.py --city manila --limit-per-city 250 --hd-limit-per-city 25
      - name: Validate generated GeoJSON chunks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          city = Path("data/facades/cities/manila")
          layers = city / "layers"
          expected = {
              "facade-windows": True,
              "facade-doors": True,
              "facade-balconies": False,
          }
          for stem, required in expected.items():
              files = sorted(layers.glob(f"{stem}-*.geojson"))
              if not files:
                  raise SystemExit(f"No chunks found for {stem}")
              total_features = total_bytes = 0
              for path in files:
                  size = path.stat().st_size
                  if size > 35_000_000:
                      raise SystemExit(f"Chunk exceeds 35 MB: {path} ({size:,} bytes)")
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if data.get("type") != "FeatureCollection" or not isinstance(data.get("features"), list):
                      raise SystemExit(f"Invalid GeoJSON chunk: {path}")
                  total_features += len(data["features"])
                  total_bytes += size
              if required and total_features == 0:
                  raise SystemExit(f"Required output is empty: {stem}")
              print(f"VALID {stem}: {len(files)} chunks, {total_features:,} features, {total_bytes:,} bytes")
          report = json.loads((city / "facade-details-report.json").read_text(encoding="utf-8"))
          if report.get("status") != "success":
              raise SystemExit("Facade report is not successful")
          PY
      - name: Save generated GeoJSON into main (retry concurrent main updates)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/facades/cities/manila/layers/facade-windows-*.geojson \
                  data/facades/cities/manila/layers/facade-doors-*.geojson \
                  data/facades/cities/manila/layers/facade-balconies-*.geojson \
                  data/facades/cities/manila/facade-details-report.json \
                  data/facades/cities/manila/review_queue.json \
                  data/facades/cities/manila/facade-review/
          if git diff --cached --quiet; then
            echo "Generated Manila facade GeoJSON is already current."
            exit 0
          fi

          git commit -m "Generate Manila facade windows and doors GeoJSON"

          # Other workflows may update main while this large output is being generated.
          # Rebase onto the newest main and retry a rejected push without regenerating.
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Save attempt $attempt/8"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Generated Manila facade GeoJSON saved to main."
              exit 0
            fi
            echo "main moved during push; retrying against its newest commit."
            sleep $((attempt * 3))
          done
          echo "Could not save generated GeoJSON after 8 concurrent-update retries." >&2
          exit 1
