name: Adam World Android Build and Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/adam-world-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build APK and AAB
        run: gradle --no-daemon assembleDebug bundleDebug

      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/debug/app-debug.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/debug/app-debug.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adam-world-v${{ github.run_number }}
          name: Adam World - Build ${{ github.run_number }}
          body: |
            **App:** Adam World
            **Publisher:** Saeed Mansour
            **Build outputs:** APK and AAB (debug-signed build for testing).
            **Note:** The AAB is debug-signed and is not ready for Google Play production upload. A private production signing key is required for that.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          fail_on_unmatched_files: true
