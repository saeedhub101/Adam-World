name: Adam World Android Build and Release
# Rebuild on launcher icon and map streaming updates

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/facades/**"
      - "tools/build_offline_city_tiles.py"
      - "data/facades/cities/**"
      - "docs/FACADE_RECONSTRUCTION_PIPELINE.md"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/adam-world-android.yml"
  workflow_run:
    workflows: ["Adam World Offline City Data Import"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Vendor the pinned Three.js runtime for offline startup
        run: |
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --retry-delay 2 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js \
            --output app/src/main/assets/vendor/three.min.js
          test -s app/src/main/assets/vendor/three.min.js

      - name: Package offline city tiles into the APK
        run: python3 tools/build_offline_city_tiles.py

      - name: Validate verified facade assignments
        run: python3 tools/facades/validate_manifest.py

      - name: Compile facade pipeline tools
        run: python3 -m py_compile tools/facades/*.py tools/facades/tests/*.py

      - name: Test global facade candidate discovery
        run: python3 -m unittest discover -s tools/facades/tests -v

      - name: Validate embedded game JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, re.I | re.S)
          inline = [body for attrs, body in scripts if "src=" not in attrs.lower() and body.strip()]
          if not inline:
              raise SystemExit("No inline game JavaScript found")
          Path("/tmp/adam-world-inline.js").write_text("\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/adam-world-inline.js
      - name: Build APK and AAB
        run: gradle --no-daemon -PVERSION_CODE=${{ github.run_number }} assembleRelease bundleRelease

      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adam-world-v${{ github.run_number }}
          name: Adam World - Build ${{ github.run_number }}
          body: |
            **App:** Adam World
            **Publisher:** Saeed Mansour
            **Build outputs:** release-variant APK and AAB (signed with the Android debug key for sideload testing; not a Google Play production signature).\n            **Version code:** ${{ github.run_number }}. The Android app checks this release automatically and can also check manually.
            **Note:** The AAB is debug-signed and is not ready for Google Play production upload. A private production signing key is required for that.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true
