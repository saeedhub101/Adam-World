name: Adam World Android Build and Release
# Builds and publishes production-key-signed APK and AAB files.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/src/main/assets/models/**"
      - "tools/facades/**"
      - "tools/build_offline_city_tiles.py"
      - "data/facades/cities/**"
      - "docs/FACADE_RECONSTRUCTION_PIPELINE.md"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_run:
    workflows:
      - "Adam World Offline City Data Import"
      - "Adam World Copernicus Terrain Import"
      - "Adam World Free 3D Asset Import"
      - "Adam World Transport Infrastructure Import"
      - "Adam World Microsoft Building Footprints Import"
      - "Adam World Amman Wide-Area Facade Evidence"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  build:
    # A partial city import still has committed checkpoints and valid older city extracts.
    # Build from the latest main state after any completed import, including partial failures.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare production signing keystore
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing GitHub Secret: ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing GitHub Secret: ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing GitHub Secret: ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing GitHub Secret: ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ADAM_WORLD_KEYSTORE_PASSWORD" -alias "$ADAM_WORLD_KEY_ALIAS" >/dev/null
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release keystore and alias validated."

      - name: Vendor the pinned Three.js runtime for offline startup
        run: |
          mkdir -p app/src/main/assets/vendor
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js \
            --output app/src/main/assets/vendor/three.min.js
          test -s app/src/main/assets/vendor/three.min.js
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/loaders/GLTFLoader.js \
            --output app/src/main/assets/vendor/GLTFLoader.js
          test -s app/src/main/assets/vendor/GLTFLoader.js
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/js/utils/SkeletonUtils.js \
            --output app/src/main/assets/vendor/SkeletonUtils.js
          test -s app/src/main/assets/vendor/SkeletonUtils.js

      - name: Package offline city tiles into the APK
        run: python3 tools/build_offline_city_tiles.py

      - name: Prepare lightweight game-content update bundle
        run: |
          set -euo pipefail
          mkdir -p app/build/updates
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('app/build/updates/adam-world-web-update.zip', 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              root = Path('app/src/main/assets')
              for rel in ['index.html', 'vendor/three.min.js', 'vendor/GLTFLoader.js', 'vendor/SkeletonUtils.js']:
                  z.write(root / rel, rel)
              for p in sorted((root / 'models').rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())
          print('WEB_UPDATE_BUNDLE_OK bytes=', Path('app/build/updates/adam-world-web-update.zip').stat().st_size)
          PY
          git fetch --force --tags origin
          PREVIOUS_RELEASE=$(git tag --list 'adam-world-v*' | sort -V | tail -n 1)
          if [ -n "$PREVIOUS_RELEASE" ]; then CHANGED_FILES=$(git diff --name-only "$PREVIOUS_RELEASE"..HEAD); else CHANGED_FILES=$(git show --format= --name-only HEAD); fi
          NATIVE_REQUIRED=false
          WEB_CONTENT_CHANGED=false
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(app/src/main/java/|app/src/main/AndroidManifest.xml|app/build.gradle|app/src/main/assets/(vendor|cities|facades)/|data/offline-world/|data/facades/cities/[^/]+/buildings[.]geojson$)'; then NATIVE_REQUIRED=true; fi
          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'app/src/main/assets/index.html'; then WEB_CONTENT_CHANGED=true; fi
          echo "NATIVE_REQUIRED=$NATIVE_REQUIRED" >> "$GITHUB_ENV"
          echo "WEB_CONTENT_CHANGED=$WEB_CONTENT_CHANGED" >> "$GITHUB_ENV"
          echo "Native APK update required: $NATIVE_REQUIRED; web content changed: $WEB_CONTENT_CHANGED"

      - name: Validate verified facade assignments
        run: python3 tools/facades/validate_manifest.py

      - name: Compile facade pipeline tools
        run: python3 -m py_compile tools/facades/*.py tools/facades/tests/*.py

      - name: Install free local computer-vision test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy opencv-python-headless

      - name: Test global facade candidate discovery
        run: python3 -m unittest discover -s tools/facades/tests -v

      - name: Validate embedded game JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, re.I | re.S)
          inline = [body for attrs, body in scripts if "src=" not in attrs.lower() and body.strip()]
          if not inline:
              raise SystemExit("No inline game JavaScript found")
          Path("/tmp/adam-world-inline.js").write_text("\\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/adam-world-inline.js

      - name: Build signed APK and AAB
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE=${{ github.run_number }} assembleRelease bundleRelease

      - name: Verify outputs and release signatures
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/adam-world-aab-signature.txt
          grep -q 'assets/vendor/three.min.js' <(unzip -l "$APK")
          grep -q 'assets/vendor/GLTFLoader.js' <(unzip -l "$APK")
          grep -q 'assets/vendor/SkeletonUtils.js' <(unzip -l "$APK")
          grep -q 'assets/models/manifest.json' <(unzip -l "$APK")
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('app/src/main/assets/models/manifest.json').read_text())
          for model in manifest.get('models', []):
              p=Path('app/src/main/assets/models')/model['file'].split('models/',1)[-1]
              if not p.is_file() or p.read_bytes()[:4] != b'glTF':
                  raise SystemExit(f"Missing or invalid GLB: {p}")
              if model.get('animated') and (int(model.get('animation_count', 0)) < 1 or int(model.get('skin_count', 0)) < 1):
                  raise SystemExit(f"Animated character lacks verified clips/skin: {p}")
          print('LOCAL_3D_ASSET_MANIFEST_OK', len(manifest.get('models', [])))
          PY
          grep -q 'assets/cities/catalog.json' <(unzip -l "$APK")
          for city in amman manila bangkok new-york paris dubai tokyo london riyadh cairo; do
            grep -q "assets/cities/$city/manifest.json" <(unzip -l "$APK")
            grep -q "assets/cities/$city/tile_" <(unzip -l "$APK")
            if [ "$city" = "amman" ]; then
              grep -q "assets/cities/$city/elevation-grid.json" <(unzip -l "$APK")
              unzip -p "$APK" "assets/cities/$city/manifest.json" | grep -q '"elevation_grid"'
            else
              if unzip -l "$APK" | grep -q "assets/cities/$city/elevation-grid.json"; then
                echo "Unexpected terrain asset for $city"; exit 1
              fi
              if unzip -p "$APK" "assets/cities/$city/manifest.json" | grep -q '"elevation_grid"'; then
                echo "Unexpected terrain manifest entry for $city"; exit 1
              fi
            fi
          done
          ls -lh "$APK" "$AAB"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adam-world-v${{ github.run_number }}
          name: Adam World - Build ${{ github.run_number }}
          body: |
            **App:** Adam World
            **Publisher:** Saeed Mansour
            **Build outputs:** APK and AAB signed with the configured release keystore.
            **Version code:** ${{ github.run_number }}
            **Signing:** Production release key supplied through GitHub Actions Secrets.
            Native-Required: ${{ env.NATIVE_REQUIRED }}
            Web-Content-Changed: ${{ env.WEB_CONTENT_CHANGED }}
            **Fast update:** The small web bundle updates game logic/UI without reinstalling the APK when native code is unchanged.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/updates/adam-world-web-update.zip
          fail_on_unmatched_files: true
