name: Adam World Offline City Data Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_offline_city_map.py"
      - ".github/workflows/offline-city-data-import.yml"
      - "data/facades/cities/catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import and commit each city incrementally
        run: python3 tools/import_offline_city_map.py
