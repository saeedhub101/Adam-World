name: Adam World Offline City Data Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_offline_city_map.py"
      - "data/facades/cities/catalog.json"
      - ".github/workflows/offline-city-data-import.yml"
  workflow_dispatch:
    inputs:
      city_slugs:
        description: "Optional comma-separated city slugs; blank imports all catalog cities"
        required: false
        type: string
        default: ""
      force_refresh:
        description: "Re-import selected cities even if current data exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      CITY_SLUGS: ${{ inputs.city_slugs || '' }}
      FORCE_REFRESH: ${{ inputs.force_refresh || false }}
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate importer
        run: python -m py_compile tools/import_offline_city_map.py

      - name: Import cities with bounded retries, live progress and resumable commits
        run: python -u tools/import_offline_city_map.py
