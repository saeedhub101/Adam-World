name: Adam World Offline City Data Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_offline_city_map.py"
      - "data/facades/cities/catalog.json"
      - ".github/workflows/offline-city-data-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main with write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate importer
        run: python -m py_compile tools/import_offline_city_map.py

      - name: Import cities with per-chunk commits and resume
        run: python tools/import_offline_city_map.py
