name: Adam World Global Facade Evidence Harvest

on:
  push:
    branches: [main]
    paths:
      - "tools/facades/fetch_catalogue_metadata.py"
      - "tools/facades/fetch_osm_buildings.py"
      - "tools/facades/build_review_queue.py"
      - "tools/facades/fetch_kartaview_metadata.py"
      - "tools/facades/prepare_facade_review.py"
      - "tools/facades/build_verified_glbs.py"
      - "app/src/main/assets/facades/verified_facades.json"
      - ".github/workflows/facade-evidence-harvest.yml"
      - "tools/facades/tests/**"
      - "data/facades/cities/**/city.json"
  workflow_run:
    workflows: ["Adam World Offline City Data Import"]
    types: [completed]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Rescan catalogues from the first page (otherwise resume/skip completed scans)"
        required: false
        type: boolean
        default: false
      city:
        description: "Optional single city slug to retry (for example manila)"
        required: false
        type: string

permissions:
  contents: write

# Share the importer lock so manual runs cannot race incremental main-branch commits.
concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate facade tooling and tests
        id: tests
        continue-on-error: true
        run: |
          python3 -m py_compile tools/facades/*.py tools/facades/tests/*.py
          python3 -m unittest discover -s tools/facades/tests -v

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch OSM building footprints with incremental city checkpoints
        id: osm
        continue-on-error: true
        env:
          REFRESH: ${{ inputs.refresh }}
          CITY: ${{ inputs.city }}
        run: |
          args=(--git-checkpoint)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ -n "$CITY" ]; then args+=(--city "$CITY"); fi
          python3 tools/facades/fetch_osm_buildings.py "${args[@]}"

      - name: Harvest global city imagery metadata with incremental repository saves
        id: catalog
        continue-on-error: true
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python3 tools/facades/fetch_catalogue_metadata.py --refresh --git-checkpoint
          else
            python3 tools/facades/fetch_catalogue_metadata.py --git-checkpoint
          fi

      # Harvest KartaView street-photo metadata for every in-game city before building any review queues.
      # Each city checkpoints its progress to main; a failed city does not block the remaining cities.
      - name: Discover public KartaView street photos across all ten cities
        id: kartaview
        continue-on-error: true
        run: |
          cities=(amman bangkok cairo dubai london manila new-york paris riyadh tokyo)
          failed=0
          for city in "${cities[@]}"; do
            echo "KARTAVIEW_CITY_START city=$city"
            if python3 tools/facades/fetch_kartaview_metadata.py --city "$city" --git-checkpoint; then
              echo "KARTAVIEW_CITY_SUCCESS city=$city"
            else
              echo "KARTAVIEW_CITY_FAILED city=$city"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build per-city facade review queues with strict geometry and licensing gates
        id: queue
        continue-on-error: true
        run: python3 tools/facades/build_review_queue.py

      - name: Download and validate local review images
        id: images
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/facades/prepare_facade_review.py --limit-per-city 50 --git-checkpoint

      - name: Build textured GLBs from human-verified facade assignments
        id: glb
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check numpy trimesh Pillow shapely
          python3 tools/facades/validate_manifest.py
          python3 tools/facades/build_verified_glbs.py

      - name: Commit generated review queues and verified GLBs
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git add -A data/facades/cities app/src/main/assets/facades
          if ! git diff --cached --quiet; then
            git commit -m "Build global city facade evidence review queues"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report partial failures after all sources have been attempted
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          OSM: ${{ steps.osm.outcome }}
          CATALOG: ${{ steps.catalog.outcome }}
          KARTAVIEW: ${{ steps.kartaview.outcome }}
          QUEUE: ${{ steps.queue.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          GLB: ${{ steps.glb.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          printf 'Facade harvest outcomes: tests=%s osm=%s catalogue=%s kartaview=%s queues=%s images=%s glb=%s commit=%s\n' "$TESTS" "$OSM" "$CATALOG" "$KARTAVIEW" "$QUEUE" "$IMAGES" "$GLB" "$COMMIT"
          for outcome in "$TESTS" "$OSM" "$CATALOG" "$KARTAVIEW" "$QUEUE" "$IMAGES" "$GLB" "$COMMIT"; do
            if [ "$outcome" != "success" ]; then exit 1; fi
          done
