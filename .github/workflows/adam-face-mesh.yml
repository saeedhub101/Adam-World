name: Build Adam photo face mesh
on:
  push:
    paths:
      - 'app/src/main/assets/characters/adam/**'
      - '.github/workflows/adam-face-mesh.yml'
      - 'tools/build_adam_face_mesh.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adam-face-mesh-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install mediapipe==0.10.21 pillow numpy scipy trimesh
      - name: Build face mesh
        run: python tools/build_adam_face_mesh.py --references app/src/main/assets/characters/adam/child-reference-01.png app/src/main/assets/characters/adam/child-reference-02.png --output app/src/main/assets/characters/adam/generated
      - name: Build full-body Adam photo cutout
        run: python tools/build_adam_fullbody_cutout.py --input app/src/main/assets/characters/adam/child-reference-01.png --output app/src/main/assets/characters/adam/generated/adam_fullbody_cutout.png
      - name: Validate outputs
        run: test -s app/src/main/assets/characters/adam/generated/adam_face_mesh.json && test -s app/src/main/assets/characters/adam/generated/adam_face_texture.png && test -s app/src/main/assets/characters/adam/generated/adam_face_surface.glb
      - name: Save outputs to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/characters/adam/generated/
          if ! git diff --cached --quiet; then
            git commit -m 'Build Adam photo-derived face mesh'
            git push origin HEAD:main
          fi
