name: Adam World Microsoft Building Footprints Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_microsoft_building_footprints.py"
      - ".github/workflows/microsoft-footprints-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import-refresh
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate importer syntax
        run: python3 -m py_compile tools/import_microsoft_building_footprints.py
      - name: Import Microsoft satellite-derived building footprints
        run: python3 tools/import_microsoft_building_footprints.py
