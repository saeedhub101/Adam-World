name: Adam World Manila Malate Landmark Data Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manila-malate-landmark-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  import-malate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure incremental repository checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import real OSM building footprints around Pedro Gil and Mabini
        run: |
          python3 tools/facades/fetch_osm_buildings.py --city manila --git-checkpoint

      - name: Rebuild compact offline tiles from the refreshed Malate footprints
        run: |
          python3 tools/build_offline_city_tiles.py
          git add app/src/main/assets/cities/manila
          if ! git diff --cached --quiet; then
            git commit -m "Package Manila Malate offline landmark and street tiles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify Robinsons Place Manila is inside imported coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/facades/cities/manila/buildings.geojson")
          data = json.loads(p.read_text(encoding="utf-8"))
          features = data.get("features", [])
          names = [str((f.get("properties") or {}).get("name", "")) for f in features]
          matches = [n for n in names if "robinsons" in n.lower()]
          print(f"MANILA_MALATE_BUILDINGS={len(features)}")
          print(f"ROBINSONS_NAME_MATCHES={matches[:10]}")
          if not features:
              raise SystemExit("No Manila Malate building footprints were imported")
          # The official mall name may not be present in OSM; the target is verified
          # spatially in the city data review stage, not inferred from a name match.
          PY
