name: Adam World Full City Source Import
on:
  push:
    branches: [main]
    paths: ["tools/import_full_city_sources.py",".github/workflows/full-city-source-import.yml"]
  workflow_dispatch:
    inputs:
      city:
        description: "One city slug; leave empty for all 15"
        required: false
        type: string
      refresh:
        description: "Re-download existing layers"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: adam-world-full-city-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open source geospatial tools
        run: python -m pip install --disable-pip-version-check overturemaps shapely
      - name: Validate importer
        run: python -m py_compile tools/import_full_city_sources.py
      - name: Import all selected cities and checkpoint each layer
        env:
          CITY: ${{ inputs.city }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=()
          if [ -n "$CITY" ]; then args+=(--city "$CITY"); fi
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python tools/import_full_city_sources.py "${args[@]}"
      - name: Save partial outputs
        if: always()
        continue-on-error: true
        run: |
          git add data/full-city-imports
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save partial full-city import outputs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
