name: Tabarbour Terrain Import

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/import_copernicus_terrain.py"
      - "data/facades/cities/tabarbour/city.json"

permissions:
  contents: write

concurrency:
  group: tabarbour-terrain-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DEM tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio

      - name: Import and checkpoint Tabarbour terrain
        run: python tools/import_copernicus_terrain.py

      - name: Package Tabarbour elevation for Android runtime
        run: |
          set -euo pipefail
          SOURCE="data/facades/cities/tabarbour/elevation-grid.json"
          TARGET="app/src/main/assets/cities/tabarbour/elevation-grid.json"
          CATALOG_TARGET="app/src/main/assets/cities/catalog.json"
          test -s "$SOURCE"
          mkdir -p "$(dirname "$TARGET")" "$(dirname "$CATALOG_TARGET")"
          cp "$SOURCE" "$TARGET"
          cp data/facades/cities/catalog.json "$CATALOG_TARGET"
          git add "$TARGET" "$CATALOG_TARGET"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Package Tabarbour terrain for Android"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "TABARBOUR_TERRAIN_PACKAGED"
