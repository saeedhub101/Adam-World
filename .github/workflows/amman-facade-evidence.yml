name: Adam World Amman Wide-Area Facade Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amman-facade-evidence.yml"
  workflow_run:
    workflows: ["Adam World Microsoft Building Footprints Import"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install local image screening dependencies
        run: python3 -m pip install --disable-pip-version-check numpy opencv-python-headless Pillow shapely trimesh
      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refresh Amman building outlines for exact photo matching
        continue-on-error: true
        run: python3 tools/facades/fetch_osm_buildings.py --city amman --git-checkpoint
      - name: Search Panoramax and OpenAerialMap in an 8 km discovery margin
        id: catalogue
        continue-on-error: true
        env:
          FACADE_CATALOGUE_PADDING_M: "8000"
        run: python3 tools/facades/fetch_catalogue_metadata.py --city amman --refresh --git-checkpoint
      - name: Match only nearby camera-facing facade candidates
        id: queue
        continue-on-error: true
        run: python3 tools/facades/build_review_queue.py --city amman --max-distance-m 100
      - name: Screen image quality locally without assigning building identity
        id: cv
        continue-on-error: true
        run: python3 tools/facades/visual_verify_facades.py --city amman
      - name: Save real licensed photo review gallery
        id: gallery
        continue-on-error: true
        run: python3 tools/facades/prepare_facade_review.py --city amman --git-checkpoint --limit-per-city 80 --hd-limit-per-city 8
      - name: Validate curated facade assignments and rebuild only approved building GLBs
        id: glb
        continue-on-error: true
        run: |
          python3 tools/facades/validate_manifest.py
          python3 tools/facades/build_verified_glbs.py
      - name: Save Amman evidence, review images and any approved GLBs
        if: always()
        continue-on-error: true
        run: |
          git add -A data/facades/cities/amman app/src/main/assets/facades
          if ! git diff --cached --quiet; then
            git commit -m "Save expanded Amman facade evidence and review gallery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source and review outcomes
        if: always()
        env:
          CATALOGUE: \${{ steps.catalogue.outcome }}
          QUEUE: \${{ steps.queue.outcome }}
          CV: \${{ steps.cv.outcome }}
          GALLERY: \${{ steps.gallery.outcome }}
          GLB: \${{ steps.glb.outcome }}
        run: |
          printf 'AMMAN_FACADE_EVIDENCE catalogue=%s queue=%s cv=%s gallery=%s approved_glb=%s\n' "$CATALOGUE" "$QUEUE" "$CV" "$GALLERY" "$GLB"
          for outcome in "$CATALOGUE" "$QUEUE" "$CV" "$GALLERY" "$GLB"; do
            if [ "$outcome" != "success" ]; then exit 1; fi
          done
