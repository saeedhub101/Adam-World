name: Adam World Android Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "data/offline-city-stream/manila/**"
      - "data/offline-city-stream/amman/**"
      - "data/offline-world/manila/**"
      - "data/offline-world/tabarbour/stream/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only runtime and build inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /Adam_Walking.glb
            /data/offline-city-stream/amman/
            /data/offline-city-stream/manila/
            /data/offline-world/manila/
            /data/offline-world/tabarbour/stream/
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Python for model conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert licensed vehicle models to Adam World binary meshes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input numpy trimesh pillow
          python app/tools/build_runtime_meshes.py
          python app/tools/build_adam_skinned_mesh.py

          # CC0 adult pedestrian with a real skinned walk cycle. The source is converted
          # at build time; only the compact runtime mesh can enter the APK.
          PED_SOURCE="$RUNNER_TEMP/adam-world-pedestrian.glb"
          PED_OUTPUT="app/src/main/assets/models/runtime/characters/pedestrian.awmesh5"
          mkdir -p "$(dirname "$PED_OUTPUT")"
          rm -f "$PED_OUTPUT"
          PED_URL="https://files.innerscene.com/library/relaxed-walk-sam-3d-person-animated-732f1206/b11d02f72ad777e03d68/relaxed-walk-sam-3d-person-animated.glb"
          if curl -fL --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 180 "$PED_URL" -o "$PED_SOURCE"; then
            if ADAM_SOURCE_GLTF="$PED_SOURCE" ADAM_OUTPUT_MESH="$PED_OUTPUT" python app/tools/build_adam_skinned_mesh.py; then
              PED_BYTES="$(stat -c%s "$PED_OUTPUT")"
              if [ "$PED_BYTES" -gt 12000000 ]; then
                rm -f "$PED_OUTPUT"
                echo "::warning::Pedestrian mesh exceeded 12 MB and was omitted to protect APK and memory budgets."
              else
                echo "Pedestrian runtime mesh ready: $PED_BYTES bytes"
              fi
            else
              rm -f "$PED_OUTPUT"
              echo "::warning::Optional CC0 pedestrian conversion failed; procedural fallback remains enabled."
            fi
          else
            echo "::warning::Optional CC0 pedestrian source was unavailable; procedural fallback remains enabled."
          fi

      - name: Prepare signing and calculate release version
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build and verify signed APK and AAB
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" assembleRelease bundleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" Adam-World.apk
          cp "$AAB" Adam-World.aab
          sha256sum Adam-World.apk Adam-World.aab

      - name: Publish release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: |
            Adam-World.apk
            Adam-World.aab
          fail_on_unmatched_files: true
