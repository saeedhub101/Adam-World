name: Adam World Android Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "data/facades/cities/manila/buildings.geojson"
      - "data/facades/cities/manila/building-footprints.geojson"
      - "data/facades/cities/manila/building-details.geojson"
      - "data/facades/cities/manila/transportation.geojson"
      - "tools/build_manila_stream_shards.py"
      - "data/reference/adam-city/manila/**"
      - "data/offline-city-stream/manila/manifest.json"
      - "data/offline-city-stream/manila/shards/**"
      - "data/offline-city-stream/amman/**"
      - "data/offline-world/manila/**"
      - "old_app/src/main/assets/data/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /data/full-city-imports/amman/
            /data/offline-city-stream/amman/
            /data/offline-world/amman/
            /data/offline-world/manila/
            /data/facades/cities/manila/buildings.geojson
            /data/facades/cities/manila/building-footprints.geojson
            /data/facades/cities/manila/building-details.geojson
            /data/facades/cities/manila/transportation.geojson
            /data/offline-world/manila/elements.json
            /tools/build_manila_stream_shards.py
            /data/reference/adam-city/manila/
            /data/offline-city-stream/manila/manifest.json
            /data/offline-city-stream/manila/shards/
            /old_app/src/main/assets/data/
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Rebuild and save Manila offline building shards
        run: |
          set -euo pipefail
          python3 tools/build_manila_stream_shards.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/offline-city-stream/manila/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          if not m.get("building_source_files", {}).get("building_footprints"):
              raise SystemExit("Manila footprint source was not consumed")
          if not m.get("building_features_with_height", 0):
              raise SystemExit("Manila merged shards contain no explicit building heights")
          if not m.get("building_features_with_levels", 0):
              raise SystemExit("Manila merged shards contain no mapped floor counts")
          print(
              "MANILA HEIGHT RESTORED: "
              f"{m['building_features']} buildings; "
              f"{m['building_features_with_height']} explicit heights; "
              f"{m['building_features_with_levels']} floor-count features."
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline-city-stream/manila/manifest.json data/offline-city-stream/manila/shards/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Manila offline building shards [skip ci]"
            git push origin HEAD:main
          else
            echo "Manila offline shards already match the merged source data."
          fi

      - name: Verify saved offline city data (no imports or downloads)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/offline-city-stream")
          manila = json.loads((root / "manila/manifest.json").read_text(encoding="utf-8"))
          amman = json.loads((root / "amman/manifest.json").read_text(encoding="utf-8"))

          # Every Manila city cell and checksum entry must exist in the repository.
          cells = manila.get("cells") or {}
          hashes = manila.get("shard_sha256") or {}
          if not cells or {cell + ".jsonl" for cell in cells} != set(hashes):
              raise SystemExit("Manila cell manifest/checksum index is incomplete")
          for cell in cells:
              p = root / "manila" / "shards" / (cell + ".jsonl.gz")
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Manila cell: {p}")

          # Verify every Amman shard described by its committed manifest.
          amman_shards = amman.get("shards") or {}
          if not amman_shards or len(amman_shards) != amman.get("shard_count"):
              raise SystemExit("Amman shard manifest is incomplete")
          for item in amman_shards.values():
              p = root / "amman" / item["file"]
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Amman shard: {p}")

          print(
              f"REPOSITORY DATA VERIFIED: Manila {len(cells)} building/road cells; "
              f"Amman {len(amman_shards)} shards."
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare the existing production signing key
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ADAM_WORLD_KEYSTORE_PASSWORD" -alias "$ADAM_WORLD_KEY_ALIAS" >/dev/null
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Calculate the next package version
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build signed Android APK
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Adam-World.apk
          sha256sum Adam-World.apk

      - name: Publish release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: Adam-World.apk
          fail_on_unmatched_files: true
