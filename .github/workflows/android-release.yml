name: Adam World Android Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "data/offline-city-stream/manila/**"
      - "data/offline-city-stream/amman/**"
      - "data/offline-world/manila/**"
      - "data/offline-world/tabarbour/stream/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only the newest requested APK matters. Do not queue obsolete releases.
concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only runtime and build inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /data/offline-city-stream/amman/
            /data/offline-city-stream/manila/
            /data/offline-world/manila/
            /data/offline-world/tabarbour/stream/
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Verify committed offline city data
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          from pathlib import Path

          root = Path("data/offline-city-stream")
          manila = json.loads((root / "manila/manifest.json").read_text(encoding="utf-8"))
          amman = json.loads((root / "amman/manifest.json").read_text(encoding="utf-8"))

          cells = manila.get("cells") or {}
          hashes = manila.get("shard_sha256") or {}
          if not cells or {cell + ".jsonl" for cell in cells} != set(hashes):
              raise SystemExit("Manila cell manifest/checksum index is incomplete")
          heights = []
          for cell in cells:
              p = root / "manila" / "shards" / (cell + ".jsonl.gz")
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Manila cell: {p}")
              with gzip.open(p, "rt", encoding="utf-8") as stream:
                  for line in stream:
                      if not line.strip():
                          continue
                      item = json.loads(line)
                      tags = item.get("tags") or {}
                      if not tags.get("building"):
                          continue
                      for key in ("height", "building:height", "height:meters", "adam:render_height_m"):
                          try:
                              value = float(str(tags.get(key, "")).replace("m", "").strip())
                          except (TypeError, ValueError):
                              continue
                          if value > 0:
                              heights.append(value)
                              break
          if len(heights) < 1700 or max(heights) <= min(heights):
              raise SystemExit(f"Manila height validation failed: {len(heights)} usable heights")

          amman_shards = amman.get("shards") or {}
          if not amman_shards or len(amman_shards) != amman.get("shard_count"):
              raise SystemExit("Amman shard manifest is incomplete")
          for item in amman_shards.values():
              p = root / "amman" / item["file"]
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Amman shard: {p}")

          tab_root = Path("data/offline-world/tabarbour/stream")
          tab = json.loads((tab_root / "manifest.json").read_text(encoding="utf-8"))
          runtime = tab.get("runtime_validation") or {}
          tiles = tab.get("tiles") or []
          if tab.get("slug") != "tabarbour" or tab.get("status") != "complete" or not tab.get("complete"):
              raise SystemExit("Tabarbour active stream manifest is incomplete")
          if len(tiles) != tab.get("expected_tile_count") or runtime.get("status") != "passed":
              raise SystemExit("Tabarbour manifest tile inventory/runtime validation is not passed")
          total = 0
          buildings = 0
          seen = set()
          for item in tiles:
              name = item.get("file", "")
              if not name or Path(name).name != name or name in seen:
                  raise SystemExit(f"Invalid or duplicate Tabarbour cell path: {name}")
              seen.add(name)
              p = tab_root / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Tabarbour cell: {p}")
              opener = gzip.open if name.endswith(".gz") else open
              with opener(p, "rt", encoding="utf-8") as stream:
                  cell = json.load(stream)
              elements = cell.get("elements")
              if not isinstance(elements, list) or len(elements) != item.get("count"):
                  raise SystemExit(f"Tabarbour cell count mismatch: {name}")
              total += len(elements)
              for feature in elements:
                  tags = feature.get("tags") or {}
                  if feature.get("type") == "way" and (
                      (tags.get("building") and tags.get("building") != "no") or tags.get("building:part")
                  ):
                      buildings += 1
          if total != tab.get("element_count") or total != runtime.get("verified_element_count"):
              raise SystemExit(f"Tabarbour element total mismatch: {total}")
          if buildings != tab.get("building_count") or buildings != runtime.get("buildings_published"):
              raise SystemExit(f"Tabarbour building total mismatch: {buildings}")
          if runtime.get("cells_checked") != len(tiles):
              raise SystemExit("Tabarbour validator cell count does not match manifest")

          print(
              f"OFFLINE_DATA_OK Manila cells={len(cells)} heights={len(heights)} "
              f"Amman shards={len(amman_shards)} Tabarbour cells={len(tiles)} "
              f"elements={total} buildings={buildings}"
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare signing and calculate release version
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ADAM_WORLD_KEYSTORE_PASSWORD" -alias "$ADAM_WORLD_KEY_ALIAS" >/dev/null
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build and verify signed APK
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Adam-World.apk
          sha256sum Adam-World.apk

      - name: Publish release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: Adam-World.apk
          fail_on_unmatched_files: true
