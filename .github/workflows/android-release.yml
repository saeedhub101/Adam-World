name: Adam World Android Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "tools/build_amman_stream_shards.py"
      - "tools/build_manila_stream_shards.py"
      - "data/facades/cities/manila/**"
      - "data/reference/adam-city/manila/**"
      - "data/offline-city-stream/manila/**"
      - "data/offline-city-stream/amman/**"
      - "data/offline-world/manila/**"
      - "old_app/src/main/assets/data/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /data/full-city-imports/amman/
            /data/offline-city-stream/amman/
            /data/offline-world/amman/
            /data/offline-world/manila/
            /data/facades/cities/manila/
            /data/reference/adam-city/manila/
            /data/offline-city-stream/manila/
            /tools/build_manila_stream_shards.py
            /old_app/src/main/assets/data/
            /tools/build_amman_stream_shards.py
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Set up Python for Amman spatial streaming
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build only the spatial Amman download shards
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ijson shapely
          python tools/build_amman_stream_shards.py

      - name: Save Amman streaming data to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/amman-offline-shards"
          mkdir -p "$SNAPSHOT"
          cp -a data/offline-city-stream/amman/. "$SNAPSHOT/"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/offline-city-stream/amman
            mkdir -p data/offline-city-stream/amman
            cp -a "$SNAPSHOT/." data/offline-city-stream/amman/
            git add data/offline-city-stream/amman
            if git diff --cached --quiet; then
              PUSHED=true
              break
            fi
            git commit -m "Build spatially streamed Amman offline data"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Main advanced during shard publish; retrying from latest main (attempt $attempt)"
          done
          if [ "$PUSHED" != true ]; then
            echo "Could not publish Amman shards after five safe retries" >&2
            exit 1
          fi

      - name: Fetch only the existing Manila PBF source tiles from Adam-City
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/saeedhub101/Adam-City.git Adam-City-source
          git -C Adam-City-source sparse-checkout set Manila/vector-tiles building-data/buildings.csv ermita/maps/generated/ermita-public_services.csv ermita/maps/generated/ermita-accessibility.csv
          test "$(find Adam-City-source/Manila/vector-tiles -type f -name '*.pbf' | wc -l)" -gt 0
          test -s Adam-City-source/building-data/buildings.csv
          test -s Adam-City-source/ermita/maps/generated/ermita-public_services.csv
          test -s Adam-City-source/ermita/maps/generated/ermita-accessibility.csv

      - name: Build spatially streamed Manila offline data
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mapbox-vector-tile
          ADAM_CITY_MANILA_PBF="$GITHUB_WORKSPACE/Adam-City-source/Manila/vector-tiles" python tools/build_manila_stream_shards.py
          test -s data/offline-city-stream/manila/manifest.json
          test "$(find data/offline-city-stream/manila -type f -name '*.jsonl.gz' | wc -l)" -gt 0

      - name: Save Manila streaming data to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/manila-offline-shards"
          mkdir -p "$SNAPSHOT"
          cp -a data/offline-city-stream/manila/. "$SNAPSHOT/"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/offline-city-stream/manila
            mkdir -p data/offline-city-stream/manila
            cp -a "$SNAPSHOT/." data/offline-city-stream/manila/
            git add data/offline-city-stream/manila
            if git diff --cached --quiet; then
              PUSHED=true
              break
            fi
            git commit -m "Build spatially streamed Manila offline data"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Main advanced during Manila shard publish; retrying (attempt $attempt)"
          done
          if [ "$PUSHED" != true ]; then
            echo "Could not publish Manila shards after five safe retries" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare the existing production signing key
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ADAM_WORLD_KEYSTORE_PASSWORD" -alias "$ADAM_WORLD_KEY_ALIAS" >/dev/null
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Calculate the next package version
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build signed Android APK
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Adam-World.apk
          sha256sum Adam-World.apk

      - name: Publish release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: Adam-World.apk
          fail_on_unmatched_files: true
