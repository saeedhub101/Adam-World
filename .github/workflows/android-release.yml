name: Adam World Android Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "3D/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "3D/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout only runtime and build inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /3D/
            /Adam_Walking.glb
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Python for model conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Convert licensed vehicle models to Adam World binary meshes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input numpy trimesh pillow scipy fast-simplification
          python -m py_compile app/tools/build_adam_skinned_mesh.py
          python app/tools/build_runtime_meshes.py
          python app/tools/build_adam_skinned_mesh.py
          test -s app/src/main/assets/models/runtime/characters/adam.awmesh5
          echo "Legacy Adam pedestrian asset ready: $(stat -c%s app/src/main/assets/models/runtime/characters/adam.awmesh5) bytes"

          # Compact, textured, rigged CC0 everyday pedestrians with Idle/Walk/Run clips.
          # Keep each converted mesh under 1.5 MB to bound APK size and GPU memory.
          mkdir -p app/src/main/assets/models/runtime/characters
          while IFS='|' read -r NAME PED_URL; do
            PED_SOURCE="$RUNNER_TEMP/adam-world-$NAME.glb"
            PED_OUTPUT="app/src/main/assets/models/runtime/characters/pedestrian-$NAME.awmesh5"
            rm -f "$PED_OUTPUT"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 50 "$PED_URL" -o "$PED_SOURCE"; then
              if ADAM_SOURCE_GLTF="$PED_SOURCE" ADAM_OUTPUT_MESH="$PED_OUTPUT" python app/tools/build_adam_skinned_mesh.py; then
                PED_BYTES="$(stat -c%s "$PED_OUTPUT")"
                if [ "$PED_BYTES" -gt 1572864 ]; then
                  rm -f "$PED_OUTPUT"
                  echo "::warning::Pedestrian $NAME exceeded 1.5 MB and was omitted."
                else
                  echo "Pedestrian $NAME ready: $PED_BYTES bytes"
                fi
              else
                rm -f "$PED_OUTPUT"
                echo "::warning::Pedestrian $NAME conversion failed; that variant will use the fallback."
              fi
            else
              echo "::warning::Pedestrian $NAME download failed; that variant will use the fallback."
            fi
          done <<'PED_MODELS'
          office|https://gobkit.com/freebies/human015/OfficeWorker.glb
          elder|https://gobkit.com/freebies/human001/GrandmaShopper.glb
          manager|https://gobkit.com/freebies/human001/StoreManager.glb
          PED_MODELS

      - name: Build the user's VRM and GLB as separate animated pedestrians
        run: |
          set -euo pipefail
          while IFS='|' read -r NAME SOURCE_REL; do
            PED_SOURCE="$GITHUB_WORKSPACE/$SOURCE_REL"
            PED_OUTPUT="app/src/main/assets/models/runtime/characters/pedestrian-$NAME.awmesh5"
            rm -f "$PED_OUTPUT"
            if [ ! -s "$PED_SOURCE" ]; then
              echo "::warning::Pedestrian source missing: $SOURCE_REL"
              continue
            fi
            if ADAM_SOURCE_GLTF="$PED_SOURCE" ADAM_OUTPUT_MESH="$PED_OUTPUT" python app/tools/build_adam_skinned_mesh.py; then
              PED_BYTES="$(stat -c%s "$PED_OUTPUT")"
              if [ "$PED_BYTES" -gt 3145728 ]; then
                rm -f "$PED_OUTPUT"
                echo "::warning::Pedestrian $NAME exceeded the 3 MB runtime budget and was omitted."
              else
                echo "User pedestrian $NAME ready: $PED_BYTES bytes"
              fi
            else
              rm -f "$PED_OUTPUT"
              echo "::warning::Pedestrian $NAME conversion failed; its model will use the existing fallback."
            fi
          done <<'USER_PED_MODELS'
          saeed-glb|3D/Saeed_NoAnimation.glb
          saeed-vrm|3D/Saeed_NoAnimation.vrm
          USER_PED_MODELS
          test -s app/src/main/assets/models/runtime/characters/pedestrian-saeed-vrm.awmesh5 || { echo '::error::Required VRM player conversion is missing'; exit 1; }
          test -s app/src/main/assets/models/runtime/characters/pedestrian-saeed-glb.awmesh5 || { echo '::error::Required Saeed GLB pedestrian conversion is missing'; exit 1; }
          test -s app/src/main/assets/models/runtime/characters/adam.awmesh5 || { echo '::error::Required legacy Adam pedestrian conversion is missing'; exit 1; }
          echo 'VRM player, Saeed GLB pedestrian and legacy Adam pedestrian assets validated.'

      - name: Prepare signing and calculate release version
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build and verify signed APK and AAB
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -PVERSION_CODE="$VERSION_CODE" assembleRelease bundleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" Adam-World.apk
          cp "$AAB" Adam-World.aab
          sha256sum Adam-World.apk Adam-World.aab

      - name: Upload signed APK and AAB as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Adam-World-v${{ env.VERSION_CODE }}-android
          path: |
            Adam-World.apk
            Adam-World.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish release with APK and AAB
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: |
            Adam-World.apk
            Adam-World.aab
          fail_on_unmatched_files: true

      - name: Report artifact fallback if release API is restricted
        if: steps.publish_release.outcome == 'failure'
        run: |
          echo "GitHub denied Release creation for this integration token." >> "$GITHUB_STEP_SUMMARY"
          echo "The signed APK and AAB were uploaded above as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

