name: Adam World Android Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "data/facades/cities/manila/**"
      - "data/reference/adam-city/manila/**"
      - "data/offline-city-stream/amman/**"
      - "data/offline-world/manila/**"
      - "old_app/src/main/assets/data/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /app/
            /data/full-city-imports/amman/
            /data/offline-city-stream/amman/
            /data/offline-world/amman/
            /data/offline-world/manila/
            /data/facades/cities/manila/
            /data/reference/adam-city/manila/
            /old_app/src/main/assets/data/
            /build.gradle
            /settings.gradle
            /gradle.properties
          sparse-checkout-cone-mode: false

      - name: Verify saved offline city data (no imports or downloads)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/offline-city-stream")
          manila_root = Path("data/offline-world/manila")
          manila_metadata = json.loads((manila_root / "metadata.json").read_text(encoding="utf-8"))
          manila_data = json.loads((manila_root / "elements.json").read_text(encoding="utf-8"))
          manila_elements = manila_data.get("elements") or []
          if manila_metadata.get("slug") != "manila":
              raise SystemExit("offline-world Manila metadata has the wrong city slug")
          if manila_metadata.get("stored_as") != "data/offline-world/manila/elements.json":
              raise SystemExit("offline-world Manila metadata points to a different source path")
          if not manila_elements or len(manila_elements) != manila_metadata.get("element_count"):
              raise SystemExit("offline-world Manila elements are empty or do not match metadata")
          building_count = sum(
              1 for item in manila_elements
              if (item.get("tags") or {}).get("building")
              or (item.get("tags") or {}).get("building:part")
          )
          road_count = sum(1 for item in manila_elements if (item.get("tags") or {}).get("highway"))
          if building_count == 0 or road_count == 0:
              raise SystemExit(f"offline-world Manila source incomplete: buildings={building_count}, roads={road_count}")

          amman = json.loads((root / "amman/manifest.json").read_text(encoding="utf-8"))

          # Verify every Amman shard described by its committed manifest.
          amman_shards = amman.get("shards") or {}
          if not amman_shards or len(amman_shards) != amman.get("shard_count"):
              raise SystemExit("Amman shard manifest is incomplete")
          for item in amman_shards.values():
              p = root / "amman" / item["file"]
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing saved Amman shard: {p}")

          print(
              f"REPOSITORY DATA VERIFIED: Manila offline-world {len(manila_elements)} OSM elements "
              f"({building_count} buildings, {road_count} roads); Amman {len(amman_shards)} shards."
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare the existing production signing key
        env:
          ADAM_WORLD_KEYSTORE_BASE64: ${{ secrets.ADAM_WORLD_KEYSTORE_BASE64 }}
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ADAM_WORLD_KEYSTORE_BASE64:?Missing ADAM_WORLD_KEYSTORE_BASE64}"
          : "${ADAM_WORLD_KEYSTORE_PASSWORD:?Missing ADAM_WORLD_KEYSTORE_PASSWORD}"
          : "${ADAM_WORLD_KEY_ALIAS:?Missing ADAM_WORLD_KEY_ALIAS}"
          : "${ADAM_WORLD_KEY_PASSWORD:?Missing ADAM_WORLD_KEY_PASSWORD}"
          KEYSTORE="$RUNNER_TEMP/adam-world-release.jks"
          printf '%s' "$ADAM_WORLD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ADAM_WORLD_KEYSTORE_PASSWORD" -alias "$ADAM_WORLD_KEY_ALIAS" >/dev/null
          echo "ADAM_WORLD_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Calculate the next package version
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          LAST_TAG="$(git tag --list 'adam-world-v[0-9]*' | sort -V | tail -n 1)"
          LAST_VERSION="${LAST_TAG##*v}"
          LAST_VERSION="${LAST_VERSION:-0}"
          VERSION_CODE="$((LAST_VERSION + 1))"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=adam-world-v$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building package version $VERSION_CODE"

      - name: Build signed Android APK
        env:
          ADAM_WORLD_KEYSTORE_PASSWORD: ${{ secrets.ADAM_WORLD_KEYSTORE_PASSWORD }}
          ADAM_WORLD_KEY_ALIAS: ${{ secrets.ADAM_WORLD_KEY_ALIAS }}
          ADAM_WORLD_KEY_PASSWORD: ${{ secrets.ADAM_WORLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Adam-World.apk
          sha256sum Adam-World.apk

      - name: Publish release and APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Adam World v${{ env.VERSION_CODE }}
          make_latest: true
          generate_release_notes: true
          files: Adam-World.apk
          fail_on_unmatched_files: true
