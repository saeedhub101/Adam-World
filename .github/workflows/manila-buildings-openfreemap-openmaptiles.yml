name: Manila All Vector Layers z1-z16 — OpenFreeMap + OpenMapTiles
on:
  push:
    branches: [main]
    paths:
      - "tools/facades/import_manila_buildings_openfreemap_openmaptiles.py"
      - ".github/workflows/manila-buildings-openfreemap-openmaptiles.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manila-buildings-geojson-refresh
  cancel-in-progress: false
jobs:
  import-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile shapely
      - name: Validate importer
        run: python -m py_compile tools/facades/import_manila_buildings_openfreemap_openmaptiles.py
      - name: Configure incremental checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Import every vector layer at zooms 1 through 16
        run: python -u tools/facades/import_manila_buildings_openfreemap_openmaptiles.py
      - name: Rebuild Manila offline shards from canonical buildings GeoJSON
        run: python -u tools/build_manila_stream_shards.py
      - name: Commit all layer GeoJSON and rebuilt game data
        if: success()
        run: |
          git add data/facades/cities/manila data/offline-city-stream/manila
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import all Manila vector layers at zooms 1-16"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No generated changes to commit."
          fi
