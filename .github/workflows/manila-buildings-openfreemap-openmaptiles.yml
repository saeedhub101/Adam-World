name: Manila All Vector Layers z1-z16 — OpenFreeMap + OpenMapTiles
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manila-buildings-geojson-refresh
  cancel-in-progress: false
jobs:
  import-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile shapely
      - name: Validate importer
        run: python -m py_compile tools/facades/import_manila_buildings_openfreemap_openmaptiles.py
      - name: Configure incremental checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Import every vector layer at zooms 1 through 16
        run: python -u tools/facades/import_manila_buildings_openfreemap_openmaptiles.py
      # Source-data persistence is a hard gate before any game/shard generation.
      - name: Commit every imported source layer to main before game build
        run: |
          git add -A data/facades/cities/manila
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Save all imported Manila source GeoJSON before game build"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Imported source snapshot already committed."
          fi
      - name: Verify committed source GeoJSON before building shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          city = Path("data/facades/cities/manila")
          canonical = city / "buildings.geojson"
          if not canonical.is_file() or canonical.stat().st_size == 0:
              raise SystemExit(f"Canonical buildings GeoJSON missing/empty after source commit: {canonical}")
          data = json.loads(canonical.read_text(encoding="utf-8"))
          features = data.get("features") if data.get("type") == "FeatureCollection" else None
          if not isinstance(features, list) or not features:
              raise SystemExit("Committed buildings.geojson is not a non-empty FeatureCollection")
          polygons = [f for f in features if (f.get("geometry") or {}).get("type") in ("Polygon", "MultiPolygon")]
          if not polygons:
              raise SystemExit("Committed buildings.geojson has no Polygon/MultiPolygon features")
          layer_files = sorted((city / "layers").glob("*.geojson"))
          if not layer_files:
              raise SystemExit("No imported vector-layer GeoJSON files were committed")
          building_layer = city / "layers" / "building-layer.geojson"
          if not building_layer.is_file() or building_layer.stat().st_size == 0:
              raise SystemExit("Distinct source building layer missing: layers/building-layer.geojson")
          if (city / "layers" / "building.geojson").exists():
              raise SystemExit("Legacy duplicate layer filename still exists: layers/building.geojson")
          for path in layer_files:
              layer = json.loads(path.read_text(encoding="utf-8"))
              if layer.get("type") != "FeatureCollection" or not isinstance(layer.get("features"), list):
                  raise SystemExit(f"Invalid committed source layer: {path}")
          print(f"SOURCE DATA VERIFIED: {len(layer_files)} layers; {len(features)} buildings; {sum(p.stat().st_size for p in layer_files):,} layer bytes")
          PY
      - name: Build local Manila runtime shards from buildings.geojson
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mapbox-vector-tile
          python -m py_compile tools/build_manila_stream_shards.py
          python -u tools/build_manila_stream_shards.py
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path("data/offline-world/manila/runtime")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("building_source") != "data/facades/cities/manila/buildings.geojson":
              raise SystemExit("Runtime building source is not canonical buildings.geojson")
          if manifest.get("building_features", 0) <= 0 or not manifest.get("cells"):
              raise SystemExit("Manila building runtime manifest is empty")
          shards = root / "shards"
          for cell in manifest["cells"]:
              path = shards / f"{cell}.jsonl.gz"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing generated Manila runtime shard: {path}")
              with gzip.open(path, "rt", encoding="utf-8") as stream:
                  if not any(line.strip() for line in stream):
                      raise SystemExit(f"Empty generated Manila runtime shard: {path}")
          print(f"RUNTIME VERIFIED: {manifest['building_features']:,} buildings from buildings.geojson; {len(manifest['cells'])} spatial cells.")
          PY
      - name: Commit generated runtime data to main
        run: |
          set -euo pipefail
          git add -A data/offline-world/manila/runtime
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build Manila runtime shards from canonical buildings GeoJSON"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Manila runtime shards are already current."
          fi
