name: Manila — Google Open Buildings 2.5D Temporal

on:
  push:
    branches: [main]
    paths:
      - "tools/import_manila_google_open_buildings_temporal.py"
      - ".github/workflows/manila-google-open-buildings-temporal.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download all annual raster tiles"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: manila-google-open-buildings-temporal
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster processing dependencies
        run: python -m pip install --disable-pip-version-check rasterio shapely
      - name: Validate importer
        run: python -m py_compile tools/import_manila_google_open_buildings_temporal.py
      - name: Import all bands for all years
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          python tools/import_manila_google_open_buildings_temporal.py "${args[@]}"
      - name: Save completed tiles and partial checkpoints to main
        if: always()
        continue-on-error: true
        run: |
          git add data/full-city-imports/manila/03_buildings_google_temporal
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import Manila Google Open Buildings temporal rasters"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
