name: Amman Roads Only Import
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amman-roads-only-import
  cancel-in-progress: false
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install road importer dependencies
        run: python -m pip install --disable-pip-version-check overturemaps ijson
      - name: Validate road importer
        run: python -m py_compile tools/import_amman_road_segments.py
      - name: Import Amman road segments only
        run: python tools/import_amman_road_segments.py
