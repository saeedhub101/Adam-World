name: Amman Transit and Water Infrastructure Import

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amman-transit-water-import
  cancel-in-progress: true

jobs:
  import-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amman sources and existing cell package
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /data/facades/cities/catalog.json
            /data/offline-world/amman/
            /data/full-city-imports/amman/
            /data/offline-city-stream/amman/
            /tools/import_city_transport_infrastructure.py
            /tools/import_public_transport_routes.py
            /tools/build_amman_stream_shards.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import Amman mapped transit stops and water utilities
        env:
          ADAM_CITY_SLUGS: amman
          ADAM_AMMAN_TRANSPORT_RADIUS_M: "12000"
        run: |
          set -euo pipefail
          python tools/import_city_transport_infrastructure.py

      - name: Import Amman public transport route relations
        env:
          ADAM_CITY_SLUGS: amman
          ADAM_AMMAN_TRANSPORT_RADIUS_M: "12000"
        run: |
          set -euo pipefail
          python tools/import_public_transport_routes.py

      - name: Build Amman spatial cell shards with integrated OSM context
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ijson shapely
          python tools/build_amman_stream_shards.py

      - name: Publish refreshed Amman cell data to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/amman-offline-shards"
          mkdir -p "$SNAPSHOT"
          cp -a data/offline-city-stream/amman/. "$SNAPSHOT/"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/offline-city-stream/amman
            mkdir -p data/offline-city-stream/amman
            cp -a "$SNAPSHOT/." data/offline-city-stream/amman/
            git add data/offline-city-stream/amman
            if git diff --cached --quiet; then PUSHED=true; break; fi
            git commit -m "Integrate Amman transit and water infrastructure into offline cells"
            if git push origin HEAD:main; then PUSHED=true; break; fi
            echo "main advanced; retrying publish (attempt $attempt)"
          done
          if [ "$PUSHED" != true ]; then
            echo "Failed to publish Amman cell package after five attempts" >&2
            exit 1
          fi
