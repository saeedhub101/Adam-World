name: Rebuild Tabarbour merged buildings into active stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/offline-world/tabarbour/merged/**"
      - "data/offline-world/tabarbour/elements.json"
      - "data/offline-world/tabarbour/transit-routes.json"
      - "data/offline-world/tabarbour/transportation.geojson"
      - "data/offline-world/tabarbour/address-points.geojson"
      - "data/offline-world/tabarbour/overture-address-points.geojson"
      - "tools/build_offline_city_tiles.py"
      - "tools/build_tabarbour_stream.py"
      - ".github/workflows/tabarbour-stream-rebuild.yml"

permissions:
  contents: write

concurrency:
  group: adam-world-main-writers
  cancel-in-progress: false

jobs:
  build-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source datasets and current stream
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            /tools/
            /data/facades/cities/catalog.json
            /data/offline-world/tabarbour/
            /app/src/main/assets/cities/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry dependency
        run: python -m pip install --disable-pip-version-check shapely

      - name: Build or resume Tabarbour cells from verified merged sources
        run: |
          set -euo pipefail
          python -m py_compile tools/build_offline_city_tiles.py tools/build_tabarbour_stream.py
          python tools/build_tabarbour_stream.py --checkpoint-every 10 --publish-checkpoints

      - name: Verify merged buildings and the playable start neighborhood
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path("data/offline-world/tabarbour")
          stream = root / "stream"
          merged = json.loads((root / "merged/manifest.json").read_text(encoding="utf-8"))
          manifest_path = stream / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = int(merged["merged_building_count"])
          assert expected >= 20000, f"Unexpected merged source count: {expected}"
          assert manifest.get("complete") is True and manifest.get("status") == "complete"
          assert int(manifest.get("building_count", 0)) >= expected, (
              f"Only {manifest.get('building_count')} buildings published; expected at least {expected}"
          )
          assert int(manifest.get("element_count", 0)) >= int(manifest["building_count"])

          tiles = manifest.get("tiles") or []
          entries = {(int(tile["ix"]), int(tile["iz"])): tile for tile in tiles}
          assert tiles and len(entries) == len(tiles), "Duplicate or empty stream manifest"
          assert len(entries) == int(manifest.get("expected_tile_count", -1)), "Expected tile count mismatch"
          metadata_total = sum(int(tile["count"]) for tile in tiles)
          assert metadata_total == int(manifest["element_count"]), (
              f"Manifest total mismatch: tiles={metadata_total}, manifest={manifest['element_count']}"
          )

          problems = []
          actual_elements = 0
          for tile in tiles:
              path = stream / tile["file"]
              if not path.is_file():
                  problems.append(f"missing:{path}")
                  continue
              if path.stat().st_size >= 100_000_000:
                  problems.append(f"over-100MB:{path}:{path.stat().st_size}")
                  continue
              opener = gzip.open if path.suffix == ".gz" else open
              try:
                  with opener(path, "rt", encoding="utf-8") as handle:
                      data = json.load(handle)
              except Exception as exc:
                  problems.append(f"invalid-json:{path}:{exc}")
                  continue
              actual = len(data.get("elements", []))
              actual_elements += actual
              if actual != int(tile["count"]):
                  problems.append(f"count:{path}:manifest={tile['count']}:actual={actual}")
          assert not problems, "Stream cell validation failed: " + " | ".join(problems[:50])
          assert actual_elements == int(manifest["element_count"]), (
              f"Verified element total mismatch: actual={actual_elements}, manifest={manifest['element_count']}"
          )

          repaired = entries.get((-9, -22))
          assert repaired is not None, "Repaired cell (-9,-22) is absent"
          repaired_path = stream / repaired["file"]
          opener = gzip.open if repaired_path.suffix == ".gz" else open
          with opener(repaired_path, "rt", encoding="utf-8") as handle:
              repaired_data = json.load(handle)
          assert len(repaired_data.get("elements", [])) == int(repaired["count"])
          assert any(
              (item.get("tags") or {}).get("adam:label_only") == "yes"
              and (item.get("tags") or {}).get("name:en") == "Shafa Badran Street"
              for item in repaired_data.get("elements", [])
          ), "Shafa Badran Street label is missing from tile (-9,-22)"

          buildings = roads = 0
          for ix in (-1, 0, 1):
              for iz in (-1, 0, 1):
                  tile = entries.get((ix, iz))
                  if not tile:
                      continue
                  path = stream / tile["file"]
                  opener = gzip.open if path.suffix == ".gz" else open
                  with opener(path, "rt", encoding="utf-8") as handle:
                      data = json.load(handle)
                  for item in data.get("elements", []):
                      tags = item.get("tags") or {}
                      if tags.get("building") or tags.get("building:part"):
                          buildings += 1
                      if tags.get("highway"):
                          roads += 1
          assert buildings > 0, f"No buildings in 750m start neighborhood: {buildings}"
          assert roads > 0, f"No roads in 750m start neighborhood: {roads}"

          manifest["runtime_validation"] = {
              "merged_buildings_expected": expected,
              "buildings_published": int(manifest["building_count"]),
              "listed_cells": len(entries),
              "cells_rechecked": len(entries),
              "cells_carried_forward": 0,
              "verified_element_count": actual_elements,
              "cell_validation_mode": "full",
              "repaired_cell": {
                  "file": repaired["file"],
                  "ix": -9,
                  "iz": -22,
                  "elements": int(repaired["count"]),
                  "added_label": "Shafa Badran Street"
              },
              "start_neighborhood_buildings": buildings,
              "start_neighborhood_roads": roads,
              "start_coordinate": {"lat": 31.997579, "lon": 35.940358},
              "start_neighborhood_cell_radius": 1,
              "status": "passed"
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(manifest["runtime_validation"], ensure_ascii=False, indent=2))
          PY

      - name: Commit and publish stream in small resumable batches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1

          # Keep each push small; a single 1,600+ file push repeatedly hit HTTP 408.
          mapfile -d '' changed < <(git ls-files -z --others --modified --deleted -- \
            data/offline-world/tabarbour/stream app/src/main/assets/cities/catalog.json)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Tabarbour stream is already current"
            exit 0
          fi

          batch_size=30
          total=${#changed[@]}
          echo "Publishing $total changed paths in batches of $batch_size"
          for ((start=0; start<total; start+=batch_size)); do
            batch=("${changed[@]:start:batch_size}")
            git add -A -- "${batch[@]}"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "Publish Tabarbour stream batch $((start / batch_size + 1))"

            pushed=false
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              # A timed-out HTTP response can occur after GitHub accepted the push.
              git fetch origin main
              if git merge-base --is-ancestor HEAD origin/main; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep "$((attempt * 5))"
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not publish batch starting at path $start"
              exit 1
            fi
            echo "PUBLISHED_BATCH $((start / batch_size + 1)) paths=$start-$((start + ${#batch[@]} - 1))"
          done
          echo "All Tabarbour stream batches are committed to main."
