name: Rebuild Tabarbour merged buildings into active stream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/offline-world/tabarbour/merged/**"
      - "data/offline-world/tabarbour/elements.json"
      - "data/offline-world/tabarbour/transit-routes.json"
      - "data/offline-world/tabarbour/transportation.geojson"
      - "data/offline-world/tabarbour/address-points.geojson"
      - "data/offline-world/tabarbour/overture-address-points.geojson"
      - "tools/build_offline_city_tiles.py"
      - "tools/build_tabarbour_stream.py"
      - "tools/facades/merge_tabarbour_sources.py"
      - ".github/workflows/tabarbour-stream-rebuild.yml"

permissions:
  contents: write

concurrency:
  group: adam-world-main-writers
  cancel-in-progress: false

jobs:
  build-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source datasets and current stream
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            /tools/
            /data/facades/cities/catalog.json
            /data/offline-world/tabarbour/
            /app/src/main/assets/cities/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry dependency
        run: python -m pip install --disable-pip-version-check shapely

      # Reconcile only the source files already committed in this repository; do not re-import external datasets.
      - name: Reconcile all existing Tabarbour sources by per-property quality
        run: |
          set -euo pipefail
          python -m py_compile tools/build_offline_city_tiles.py tools/build_tabarbour_stream.py tools/facades/merge_tabarbour_sources.py
          python tools/facades/merge_tabarbour_sources.py --chunk-size 2500

      - name: Rebuild or resume runtime cells with incremental GitHub checkpoints
        run: |
          set -euo pipefail
          python tools/build_offline_city_tiles.py --city tabarbour --checkpoint-every 10 --publish-checkpoints

      - name: Verify merged buildings and the playable start neighborhood
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path("data/offline-world/tabarbour")
          stream = root / "stream"
          merged = json.loads((root / "merged/manifest.json").read_text(encoding="utf-8"))
          manifest_path = stream / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = int(merged["merged_building_count"])
          assert expected >= 20000, f"Unexpected merged source count: {expected}"
          assert manifest.get("complete") is True and manifest.get("status") == "complete"
          assert int(manifest.get("building_count", 0)) >= expected, (
              f"Only {manifest.get('building_count')} buildings published; expected at least {expected}"
          )
          assert int(manifest.get("element_count", 0)) >= int(manifest["building_count"])

          tiles = manifest.get("tiles") or []
          entries = {(int(tile["ix"]), int(tile["iz"])): tile for tile in tiles}
          assert tiles and len(entries) == len(tiles), "Duplicate or empty stream manifest"
          assert len(entries) == int(manifest.get("expected_tile_count", -1)), "Expected tile count mismatch"
          metadata_total = sum(int(tile["count"]) for tile in tiles)
          assert metadata_total == int(manifest["element_count"]), (
              f"Manifest total mismatch: tiles={metadata_total}, manifest={manifest['element_count']}"
          )

          problems = []
          actual_elements = 0
          seen_buildings = set()
          height_count = floor_count = hotel_count = hospital_count = shop_count = 0
          park_count = pitch_count = playground_count = 0
          def positive_number(value):
              try:
                  number = float(str(value).lower().replace("meters", "").replace("meter", "").replace("m", "").strip())
                  return number if number > 0 else None
              except (TypeError, ValueError):
                  return None
          for tile in tiles:
              path = stream / tile["file"]
              if not path.is_file():
                  problems.append(f"missing:{path}")
                  continue
              if path.stat().st_size >= 100_000_000:
                  problems.append(f"over-100MB:{path}:{path.stat().st_size}")
                  continue
              opener = gzip.open if path.suffix == ".gz" else open
              try:
                  with opener(path, "rt", encoding="utf-8") as handle:
                      data = json.load(handle)
              except Exception as exc:
                  problems.append(f"invalid-json:{path}:{exc}")
                  continue
              actual = len(data.get("elements", []))
              actual_elements += actual
              if actual != int(tile["count"]):
                  problems.append(f"count:{path}:manifest={tile['count']}:actual={actual}")
              for feature in data.get("elements", []):
                  tags = feature.get("tags") or {}
                  if not (tags.get("building") or tags.get("building:part")):
                      if tags.get("leisure") in ("park", "garden", "pitch", "playground"): park_count += 1
                      continue
                  identity = (feature.get("type"), str(feature.get("id")))
                  if identity in seen_buildings: continue
                  seen_buildings.add(identity)
                  if any(positive_number(tags.get(key)) for key in ("height", "building:height", "height:meters")):
                      height_count += 1
                  if any(positive_number(tags.get(key)) for key in ("building:levels", "num_floors", "levels")):
                      floor_count += 1
                  building = str(tags.get("building") or "").lower()
                  if building in ("hotel", "motel", "hostel") or tags.get("tourism") in ("hotel", "motel", "hostel", "guest_house"):
                      hotel_count += 1
                  if building in ("hospital", "clinic", "health_centre") or tags.get("amenity") in ("hospital", "clinic") or tags.get("healthcare") in ("hospital", "clinic"):
                      hospital_count += 1
                  if tags.get("shop") or building in ("retail", "shop", "supermarket", "mall", "commercial"):
                      shop_count += 1
                  if tags.get("leisure") in ("park", "garden") or tags.get("landuse") in ("recreation_ground", "village_green"):
                      park_count += 1
                  if tags.get("leisure") == "pitch" or tags.get("sport"):
                      pitch_count += 1
                  if tags.get("leisure") == "playground":
                      playground_count += 1
          assert not problems, "Stream cell validation failed: " + " | ".join(problems[:50])
          assert actual_elements == int(manifest["element_count"]), (
              f"Verified element total mismatch: actual={actual_elements}, manifest={manifest['element_count']}"
          )

          repaired = entries.get((-9, -22))
          assert repaired is not None, "Repaired cell (-9,-22) is absent"
          repaired_path = stream / repaired["file"]
          opener = gzip.open if repaired_path.suffix == ".gz" else open
          with opener(repaired_path, "rt", encoding="utf-8") as handle:
              repaired_data = json.load(handle)
          assert len(repaired_data.get("elements", [])) == int(repaired["count"])
          assert any(
              (item.get("tags") or {}).get("adam:label_only") == "yes"
              and (item.get("tags") or {}).get("name:en") == "Shafa Badran Street"
              for item in repaired_data.get("elements", [])
          ), "Shafa Badran Street label is missing from tile (-9,-22)"

          buildings = roads = 0
          for ix in (-1, 0, 1):
              for iz in (-1, 0, 1):
                  tile = entries.get((ix, iz))
                  if not tile:
                      continue
                  path = stream / tile["file"]
                  opener = gzip.open if path.suffix == ".gz" else open
                  with opener(path, "rt", encoding="utf-8") as handle:
                      data = json.load(handle)
                  for item in data.get("elements", []):
                      tags = item.get("tags") or {}
                      if tags.get("building") or tags.get("building:part"):
                          buildings += 1
                      if tags.get("highway"):
                          roads += 1
          assert buildings > 0, f"No buildings in 750m start neighborhood: {buildings}"
          assert roads > 0, f"No roads in 750m start neighborhood: {roads}"

          manifest["runtime_validation"] = {
              "merged_buildings_expected": expected,
              "buildings_published": int(manifest["building_count"]),
              "listed_cells": len(entries),
              "cells_rechecked": len(entries),
              "cells_carried_forward": 0,
              "verified_element_count": actual_elements,
              "cell_validation_mode": "full",
              "repaired_cell": {
                  "file": repaired["file"],
                  "ix": -9,
                  "iz": -22,
                  "elements": int(repaired["count"]),
                  "added_label": "Shafa Badran Street"
              },
              "start_neighborhood_buildings": buildings,
              "start_neighborhood_roads": roads,
              "start_coordinate": {"lat": 31.997579, "lon": 35.940358},
              "start_neighborhood_cell_radius": 1,
              "status": "passed"
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          manifest["building_attribute_audit"] = {
              "unique_buildings": len(seen_buildings),
              "explicit_metric_height": height_count,
              "mapped_floor_count": floor_count,
              "hotel_features": hotel_count,
              "hospital_features": hospital_count,
              "commercial_shop_features": shop_count,
              "park_garden_features": park_count,
              "sports_pitch_features": pitch_count,
              "playground_features": playground_count,
              "height_coverage_percent": round(100.0 * height_count / max(1, len(seen_buildings)), 2),
              "floor_coverage_percent": round(100.0 * floor_count / max(1, len(seen_buildings)), 2)
          }
          print(json.dumps(manifest["runtime_validation"], ensure_ascii=False, indent=2))
          print(json.dumps(manifest["building_attribute_audit"], ensure_ascii=False, indent=2))
          PY

      - name: Publish final manifest and remove obsolete tiles safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1

          publish_commit() {
            git commit -m "$1"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git merge-base --is-ancestor origin/main HEAD; then
                git rebase origin/main
              fi
              if git push origin HEAD:main; then
                return 0
              fi
              git fetch origin main
              if git merge-base --is-ancestor HEAD origin/main; then
                return 0
              fi
              sleep "$((attempt * 4))"
            done
            echo "::error::Unable to publish Tabarbour commit"
            return 1
          }

          # Recompute the deletion list after EVERY commit. A static list becomes
          # stale when the first batch removes paths from the Git index.
          while true; do
            mapfile -d '' batch < <(git ls-files -z --deleted -- data/offline-world/tabarbour/stream | head -z -n 30)
            if [ "${#batch[@]}" -eq 0 ]; then
              break
            fi
            git add -A -- "${batch[@]}"
            if ! git diff --cached --quiet; then
              publish_commit "Remove obsolete Tabarbour stream tiles"
            fi
          done

          # The builder already committed each tile checkpoint while building.
          # Only the final validated manifest remains to publish here.
          git add -A -- data/offline-world/tabarbour/stream/manifest.json
          if ! git diff --cached --quiet; then
            publish_commit "Publish validated Tabarbour stream manifest"
          fi
          echo "TABARBOUR_FINAL_MANIFEST_PUBLISHED"
