name: Adam World — Original Building Footprints, Details and Facade Evidence

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch source datasets instead of keeping valid city checkpoints"
        required: false
        type: boolean
        default: false
      city:
        description: "Optional city slug; leave empty for all ten cities"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "tools/facades/import_city_building_sources.py"
      - ".github/workflows/city-building-sources-import.yml"

permissions:
  contents: write

concurrency:
  group: adam-world-original-building-sources
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free source-data parsers
        run: python3 -m pip install --disable-pip-version-check mapbox-vector-tile shapely osm2geojson
      - name: Configure incremental commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Import OpenFreeMap building footprints, transportation and supplementary OSM building details
        continue-on-error: true
        env:
          REFRESH: ${{ inputs.refresh }}
          CITY: ${{ inputs.city }}
        run: |
          args=(--git-checkpoint)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ -n "$CITY" ]; then args+=(--city "$CITY"); fi
          python3 tools/facades/import_city_building_sources.py "${args[@]}"
      - name: Ensure OSM building outlines for facade matching
        continue-on-error: true
        env:
          REFRESH: ${{ inputs.refresh }}
          CITY: ${{ inputs.city }}
        run: |
          args=(--git-checkpoint)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ -n "$CITY" ]; then args+=(--city "$CITY"); fi
          python3 tools/facades/fetch_osm_buildings.py "${args[@]}"
      - name: Harvest Panoramax facade photographs and OpenAerialMap roof evidence
        continue-on-error: true
        env:
          REFRESH: ${{ inputs.refresh }}
          CITY: ${{ inputs.city }}
        run: |
          args=(--git-checkpoint)
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ -n "$CITY" ]; then args+=(--city "$CITY"); fi
          python3 tools/facades/fetch_catalogue_metadata.py "${args[@]}"
      - name: Build facade photo-to-building review candidates
        continue-on-error: true
        run: python3 tools/facades/build_review_queue.py
      - name: Commit any remaining generated source records
        if: always()
        continue-on-error: true
        run: |
          git add -A data/facades/cities
          if ! git diff --cached --quiet; then
            git commit -m "Save per-city building source and facade evidence data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate requested city outputs and report facade evidence
        if: always()
        env:
          CITY: ${{ inputs.city }}
        run: |
          python3 -m py_compile tools/facades/import_city_building_sources.py
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path("data/facades/cities")
          cities = [os.environ["CITY"]] if os.environ.get("CITY") else [
              "amman", "manila", "bangkok", "new-york", "paris",
              "dubai", "tokyo", "london", "riyadh", "cairo"
          ]
          failed = []
          for slug in cities:
              folder = root / slug
              for name in ("building-footprints.geojson", "transportation.geojson", "building-details.geojson"):
                  path = folder / name
                  if not path.is_file():
                      print(f"MISSING {slug}/{name}")
                      failed.append(f"{slug}/{name}")
                      continue
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                      print(f"OK {slug}/{name}: {len(data.get('features', []))} features")
                      if name == "transportation.geojson":
                          roads = sum(1 for f in data.get("features", []) if (f.get("properties") or {}).get("adam:label_only") != "yes")
                          labels = sum(1 for f in data.get("features", []) if (f.get("properties") or {}).get("adam:label_only") == "yes")
                          print(f"  OpenFreeMap roads={roads}; transportation_name labels={labels}")
                  except Exception as exc:
                      print(f"INVALID {slug}/{name}: {exc}")
                      failed.append(f"{slug}/{name}")
              photo = folder / "panoramax-items.geojson"
              if photo.is_file():
                  try:
                      print(f"FACADE EVIDENCE {slug}: {len(json.loads(photo.read_text(encoding='utf-8')).get('features', []))} Panoramax records")
                  except Exception:
                      print(f"FACADE EVIDENCE {slug}: metadata file unreadable")
              else:
                  print(f"FACADE EVIDENCE {slug}: not available yet; no facade texture is claimed")
          if failed:
              print("Missing/invalid source outputs: " + ", ".join(failed))
              sys.exit(1)
          PY
