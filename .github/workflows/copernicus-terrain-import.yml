name: Adam World Copernicus Terrain Import

on:
  push:
    branches: [main]
    paths:
      - "tools/import_copernicus_terrain.py"
      - ".github/workflows/copernicus-terrain-import.yml"
      - "data/facades/cities/catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adam-world-offline-city-import-refresh
  cancel-in-progress: false

jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free raster tools
        run: python -m pip install --disable-pip-version-check numpy rasterio

      - name: Import and checkpoint each city's Copernicus DEM grid
        run: python3 tools/import_copernicus_terrain.py

      - name: Validate Amman-only terrain
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('data/facades/cities/catalog.json').read_text())
          amman=Path('data/facades/cities/amman/elevation-grid.json')
          assert amman.exists(), 'Amman terrain grid is required'
          grid=json.loads(amman.read_text())
          assert grid['rows']==201 and grid['cols']==201
          for city in catalog['cities']:
              if city['slug']!='amman':
                  path=Path('data/facades/cities')/city['slug']/'elevation-grid.json'
                  assert not path.exists(), f"Terrain must be disabled for {city['slug']}"
          print('AMMAN_ONLY_TERRAIN_VALIDATION_OK')
          PY
