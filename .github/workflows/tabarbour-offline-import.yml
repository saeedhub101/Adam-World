name: Tabarbour Offline Data Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tabarbour-offline-import.yml"
      - "data/facades/cities/catalog.json"
      - "data/offline-world/tabarbour/city.json"
      - "data/offline-world/tabarbour/**"
      - "tools/facades/import_city_building_sources.py"
      - "tools/facades/import_tabarbour_overture.py"
      - "tools/facades/fetch_catalogue_metadata.py"
      - "tools/facades/build_review_queue.py"
      - "tools/build_offline_city_tiles.py"
      - "tools/extract_tabarbour_osm_context.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabarbour-offline-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Tabarbour sources and build tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /data/facades/cities/catalog.json
            /data/facades/cities/tabarbour/
            /data/offline-world/tabarbour/
            /tools/facades/import_city_building_sources.py
            /tools/facades/import_tabarbour_overture.py
            /tools/facades/fetch_catalogue_metadata.py
            /tools/facades/build_review_queue.py
            /tools/build_offline_city_tiles.py
            /tools/extract_tabarbour_osm_context.py
          sparse-checkout-cone-mode: false

      - name: Consolidate all existing Tabarbour sources under offline-world
        run: |
          set -euo pipefail
          mkdir -p data/offline-world/tabarbour
          if [ -d data/facades/cities/tabarbour ]; then
            cp -an data/facades/cities/tabarbour/. data/offline-world/tabarbour/
          fi
          test -s data/offline-world/tabarbour/city.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoJSON and vector-tile parsers
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile osm2geojson shapely overturemaps pyogrio

      - name: Import Tabarbour footprints, roads, road names and OSM building details
        run: |
          set -euo pipefail
          python -m py_compile tools/facades/import_city_building_sources.py
          # Refresh damaged/empty partial files; never checkpoint individual files mid-import.
          python tools/facades/import_city_building_sources.py --city tabarbour --cities-root data/offline-world --refresh
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/facades/cities/tabarbour")
          required = {
              "building-footprints.geojson": 1,
              "transportation.geojson": 1,
              "building-details.geojson": 1,
            "address-points.geojson": 0,
          }
          for name, minimum in required.items():
              path = root / name
              if not path.is_file() or path.stat().st_size < 20:
                  raise SystemExit(f"Missing or empty required Tabarbour source: {path}")
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")
              features = data.get("features") if isinstance(data, dict) else None
              if not isinstance(features, list) or len(features) < minimum:
                  raise SystemExit(f"No GeoJSON features in {path}")
              print(f"VALID {path}: {len(features)} features, {path.stat().st_size} bytes")
          PY

      - name: Import independent Overture and OpenBuildingMap heights, floors, building parts and address points
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/import_tabarbour_overture.py
          python tools/facades/import_tabarbour_overture.py --refresh
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/facades/cities/tabarbour")
          for name in ("overture-building-details.geojson", "overture-building-parts.geojson", "overture-address-points.geojson", "openbuildingmap-buildings.geojson"):
              path = root / name
              if not path.is_file():
                  print(f"OPTIONAL MULTI-SOURCE DATA UNAVAILABLE: {name}")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"MULTI-SOURCE VALID {name}: {len(data.get('features', []))} features")
          PY

      - name: Harvest Tabarbour Panoramax and aerial imagery catalogues
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/fetch_catalogue_metadata.py
          # Metadata pages are saved locally and published with the final snapshot.
          python tools/facades/fetch_catalogue_metadata.py --cities-root data/offline-world --city tabarbour

      - name: Build facade photo review candidates from Tabarbour footprints
        run: |
          set -euo pipefail
          python -m py_compile tools/facades/build_review_queue.py
          python tools/facades/build_review_queue.py --cities-root data/offline-world --city tabarbour
          test -s data/facades/cities/tabarbour/review_queue.json
          python -m json.tool data/facades/cities/tabarbour/review_queue.json >/dev/null

      - name: Download Tabarbour-only OSM context and source elevation tiles
        run: |
          set -euo pipefail
          python -m py_compile tools/extract_tabarbour_osm_context.py
          python tools/extract_tabarbour_osm_context.py
          test -s data/offline-world/tabarbour/elements.json
          test -s data/offline-world/tabarbour/terrain/manifest.json
          python -m json.tool data/offline-world/tabarbour/elements.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/offline-world/tabarbour/terrain/manifest.json")
          m = json.loads(p.read_text())
          if m.get("city") != "tabarbour" or not m.get("complete") or m.get("tile_count") != m.get("expected_tile_count"):
              raise SystemExit(f"Tabarbour terrain coverage incomplete: {m}")
          for rel in m.get("tiles", []):
              tile = Path("data/offline-world/tabarbour/terrain") / rel
              if not tile.is_file() or tile.stat().st_size < 100:
                  raise SystemExit(f"Missing terrain tile: {tile}")
          print(f"VALID Tabarbour elevation: {m['tile_count']} source tiles")
          PY

      - name: Build Tabarbour spatial tiles outside the Android package
        run: |
          set -euo pipefail
          python -m py_compile tools/build_offline_city_tiles.py
          mkdir -p data/offline-world/tabarbour/stream
          find data/offline-world/tabarbour/stream -maxdepth 1 -name 'tile_*.json' -delete
          python tools/build_offline_city_tiles.py --city tabarbour
          test -s data/offline-world/tabarbour/stream/manifest.json
          test "$(find data/offline-world/tabarbour/stream -maxdepth 1 -name 'tile_*.json' | wc -l)" -gt 0
          test -s data/offline-world/tabarbour/terrain/manifest.json
          python -m json.tool data/offline-world/tabarbour/stream/manifest.json >/dev/null
          python -m json.tool data/offline-world/tabarbour/terrain/manifest.json >/dev/null

      - name: Verify external Tabarbour dataset and publish checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("data/offline-world/tabarbour/stream")
          manifest = json.loads((base / "manifest.json").read_text())
          tiles = list(base.glob("tile_*.json"))
          if manifest.get("slug") != "tabarbour":
              raise SystemExit("Spatial manifest slug is not Tabarbour")
          if not tiles:
              raise SystemExit("No Tabarbour spatial cells were generated")
          for path in tiles:
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.get("elements"), list):
                  raise SystemExit(f"Invalid spatial cell: {path}")
          terrain = json.loads((base / "terrain/manifest.json").read_text())
          if terrain.get("city") != "tabarbour" or not terrain.get("complete"):
              raise SystemExit("Tabarbour source terrain is incomplete")
          print(f"VERIFIED external Tabarbour dataset: {len(tiles)} spatial cells; {terrain['tile_count']} terrain tiles")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/tabarbour-publish"
          mkdir -p "$SNAPSHOT"
          mkdir -p "$SNAPSHOT/data/offline-world/tabarbour"
          cp -a data/offline-world/tabarbour/. "$SNAPSHOT/data/offline-world/tabarbour/"
          PUBLISHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Tabarbour is one external dataset; no city source or derived file belongs in APK assets.
            mkdir -p data/offline-world/tabarbour
            cp -a "$SNAPSHOT/data/offline-world/tabarbour/." data/offline-world/tabarbour/
            rm -rf data/facades/cities/tabarbour app/src/main/assets/cities/tabarbour
            git add -A data/offline-world/tabarbour data/facades/cities/tabarbour app/src/main/assets/cities/tabarbour
            if git diff --cached --quiet; then
              PUBLISHED=true
              break
            fi
            git commit -m "Import Tabarbour offline world data outside APK"
            if git push origin HEAD:main; then
              PUBLISHED=true
              break
            fi
            echo "main advanced during publish; retrying with preserved Tabarbour data (attempt $attempt)"
          done
          if [ "$PUBLISHED" != true ]; then
            echo "Could not publish Tabarbour data after five safe retries" >&2
            exit 1
          fi
