name: Tabarbour Offline Data Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tabarbour-offline-import.yml"
      - "data/facades/cities/catalog.json"
      - "data/offline-world/tabarbour/city.json"
      - "tools/facades/import_city_building_sources.py"
      - "tools/facades/import_tabarbour_overture.py"
      - "tools/facades/fetch_catalogue_metadata.py"
      - "tools/facades/build_review_queue.py"
      - "tools/build_offline_city_tiles.py"
      - "tools/extract_tabarbour_osm_context.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabarbour-offline-import
  cancel-in-progress: false

jobs:
  import:
    # Checkpoint commits by this workflow must not recursively trigger another import.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tabarbour sources and tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /data/facades/cities/catalog.json
            /data/facades/cities/tabarbour/
            /data/offline-world/tabarbour/
            /app/src/main/assets/cities/tabarbour/
            /tools/facades/import_city_building_sources.py
            /tools/facades/import_tabarbour_overture.py
            /tools/facades/fetch_catalogue_metadata.py
            /tools/facades/build_review_queue.py
            /tools/build_offline_city_tiles.py
            /tools/extract_tabarbour_osm_context.py
          sparse-checkout-cone-mode: false

      - name: Create incremental checkpoint publisher
        run: |
          cat > "$RUNNER_TEMP/checkpoint-tabarbour.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="${1:-stage}"
          snapshot="$RUNNER_TEMP/tabarbour-checkpoint"
          rm -rf "$snapshot" && mkdir -p "$snapshot"
          if [ -d data/offline-world/tabarbour ]; then
            cp -a data/offline-world/tabarbour/. "$snapshot/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/offline-world/tabarbour
            cp -a "$snapshot/." data/offline-world/tabarbour/
            if [[ "$label" == *"legacy cleanup"* ]]; then
              rm -rf data/facades/cities/tabarbour app/src/main/assets/cities/tabarbour
            fi
            git add -A data/offline-world/tabarbour data/facades/cities/tabarbour app/src/main/assets/cities/tabarbour
            if git diff --cached --quiet; then
              echo "CHECKPOINT unchanged: $label"
              exit 0
            fi
            git commit -m "Checkpoint Tabarbour: $label"
            if git push origin HEAD:main; then
              echo "CHECKPOINT PUBLISHED: $label"
              exit 0
            fi
            echo "Push race; retrying checkpoint $label ($attempt/5)"
          done
          echo "CHECKPOINT FAILED: $label" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/checkpoint-tabarbour.sh"

      - name: Consolidate old Tabarbour sources into offline-world
        continue-on-error: true
        run: |
          mkdir -p data/offline-world/tabarbour
          if [ -d data/facades/cities/tabarbour ]; then
            cp -an data/facades/cities/tabarbour/. data/offline-world/tabarbour/
          fi
          test -s data/offline-world/tabarbour/city.json
      - name: Publish consolidation immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "source consolidation"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install import dependencies
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile osm2geojson shapely overturemaps pyogrio
      - name: Checkpoint environment stage
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "environment setup"

      - name: Import footprints, roads, road names and OSM details
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/import_city_building_sources.py
          python tools/facades/import_city_building_sources.py --city tabarbour --cities-root data/offline-world
      - name: Publish base map and building data immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "footprints roads names and OSM details"

      - name: Import Overture and OpenBuildingMap heights, floors, parts and addresses
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/import_tabarbour_overture.py
          python tools/facades/import_tabarbour_overture.py
      - name: Publish multi-source building data immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "building heights floors parts and addresses"

      - name: Harvest Panoramax and aerial imagery catalogues
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/fetch_catalogue_metadata.py
          python tools/facades/fetch_catalogue_metadata.py --cities-root data/offline-world --city tabarbour --git-checkpoint
      - name: Publish imagery catalogues immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "Panoramax and aerial imagery catalogues"

      - name: Build facade photo review candidates
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/build_review_queue.py
          python tools/facades/build_review_queue.py --cities-root data/offline-world --city tabarbour
          test -s data/offline-world/tabarbour/review_queue.json
          python -m json.tool data/offline-world/tabarbour/review_queue.json >/dev/null
      - name: Publish facade review queue immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "facade photo review queue"

      - name: Download Tabarbour OSM context and elevation tiles
        continue-on-error: true
        run: |
          python -m py_compile tools/extract_tabarbour_osm_context.py
          python tools/extract_tabarbour_osm_context.py
          test -s data/offline-world/tabarbour/elements.json
          test -s data/offline-world/tabarbour/terrain/manifest.json
          python -m json.tool data/offline-world/tabarbour/elements.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/offline-world/tabarbour/terrain/manifest.json")
          m = json.loads(p.read_text())
          if m.get("city") != "tabarbour" or not m.get("complete") or m.get("tile_count") != m.get("expected_tile_count"):
              raise SystemExit(f"Terrain coverage incomplete: {m}")
          for rel in m.get("tiles", []):
              tile = Path("data/offline-world/tabarbour/terrain") / rel
              if not tile.is_file() or tile.stat().st_size < 100:
                  raise SystemExit(f"Missing terrain tile: {tile}")
          print(f"VALID elevation tiles: {m['tile_count']}")
          PY
      - name: Publish OSM context and elevation immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "OSM context and elevation"

      - name: Build spatial streaming tiles outside APK
        continue-on-error: true
        run: |
          mkdir -p data/offline-world/tabarbour/stream
          python -m py_compile tools/build_offline_city_tiles.py
          # Keep previous good tiles until replacements have been generated.
          python tools/build_offline_city_tiles.py --city tabarbour
          test -s data/offline-world/tabarbour/stream/manifest.json
          test "$(find data/offline-world/tabarbour/stream -maxdepth 1 -name 'tile_*.json' | wc -l)" -gt 0
          python -m json.tool data/offline-world/tabarbour/stream/manifest.json >/dev/null
      - name: Publish spatial streaming tiles immediately
        if: always()
        run: bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "spatial streaming tiles"

      - name: Verify what was produced without blocking other stages
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/offline-world/tabarbour")
          for rel in ("building-footprints.geojson","transportation.geojson","building-details.geojson",
                      "elements.json","review_queue.json","stream/manifest.json","terrain/manifest.json"):
              p = root / rel
              if not p.is_file() or not p.stat().st_size:
                  print(f"NOT AVAILABLE: {rel}")
                  continue
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
                  print(f"VALID: {rel}; features={len(obj.get('features', []))}; bytes={p.stat().st_size}")
              except Exception as exc:
                  print(f"INVALID: {rel}: {exc}")
          print("STREAM CELLS:", len(list((root / "stream").glob("tile_*.json"))))
          PY

      - name: Remove legacy APK/source copies and save final checkpoint
        if: always()
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/cities/tabarbour data/facades/cities/tabarbour
          bash "$RUNNER_TEMP/checkpoint-tabarbour.sh" "legacy cleanup and final verification"
