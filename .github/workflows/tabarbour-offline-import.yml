name: Tabarbour Offline Data Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tabarbour-offline-import.yml"
      - "data/facades/cities/catalog.json"
      - "data/facades/cities/tabarbour/city.json"
      - "tools/facades/import_city_building_sources.py"
      - "tools/facades/fetch_catalogue_metadata.py"
      - "tools/facades/build_review_queue.py"
      - "tools/build_offline_city_tiles.py"
      - "tools/extract_tabarbour_osm_context.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabarbour-offline-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the dedicated Tabarbour dataset and required tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /app/src/main/assets/cities/
            /data/facades/cities/catalog.json
            /data/facades/cities/tabarbour/
            /data/offline-world/tabarbour/
            /tools/facades/import_city_building_sources.py
            /tools/facades/fetch_catalogue_metadata.py
            /tools/facades/build_review_queue.py
            /tools/build_offline_city_tiles.py
            /tools/extract_tabarbour_osm_context.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoJSON and vector-tile parsers
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile osm2geojson shapely

      - name: Import Tabarbour footprints, road geometry, names and building details directly
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/import_city_building_sources.py
          python tools/facades/import_city_building_sources.py --city tabarbour

      - name: Harvest Tabarbour Panoramax and aerial catalogue metadata
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/fetch_catalogue_metadata.py
          python tools/facades/fetch_catalogue_metadata.py --city tabarbour

      - name: Build facade photo review candidates
        continue-on-error: true
        run: |
          python -m py_compile tools/facades/build_review_queue.py
          python tools/facades/build_review_queue.py --city tabarbour

      - name: Download Tabarbour-only OSM context and elevation source tiles
        run: |
          python -m py_compile tools/extract_tabarbour_osm_context.py
          python tools/extract_tabarbour_osm_context.py
          test -s data/offline-world/tabarbour/elements.json
          test -s data/offline-world/tabarbour/terrain/manifest.json

      - name: Build compact Tabarbour-only Android spatial assets
        run: |
          python -m py_compile tools/build_offline_city_tiles.py
          rm -rf app/src/main/assets/cities/tabarbour
          python tools/build_offline_city_tiles.py --city tabarbour
          test -s app/src/main/assets/cities/tabarbour/manifest.json
          test "$(find app/src/main/assets/cities/tabarbour -maxdepth 1 -name 'tile_*.json' | wc -l)" -gt 0
          mkdir -p app/src/main/assets/cities/tabarbour/terrain
          cp -a data/offline-world/tabarbour/terrain/. app/src/main/assets/cities/tabarbour/terrain/
          test -s app/src/main/assets/cities/tabarbour/terrain/manifest.json

      - name: Verify dedicated Tabarbour data and publish one conflict-safe checkpoint
        run: |
          set -euo pipefail
          test -s data/facades/cities/tabarbour/building-footprints.geojson
          test -s data/facades/cities/tabarbour/transportation.geojson
          test -s data/facades/cities/tabarbour/building-details.geojson
          test -s data/offline-world/tabarbour/elements.json
          test -s app/src/main/assets/cities/tabarbour/manifest.json
          test -s data/offline-world/tabarbour/terrain/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/tabarbour-publish"
          mkdir -p "$SNAPSHOT"
          for path in data/facades/cities/tabarbour data/offline-world/tabarbour app/src/main/assets/cities/tabarbour; do
            mkdir -p "$SNAPSHOT/$path"
            cp -a "$path/." "$SNAPSHOT/$path/"
          done
          PUBLISHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for path in data/facades/cities/tabarbour data/offline-world/tabarbour app/src/main/assets/cities/tabarbour; do
              mkdir -p "$path"
              cp -a "$SNAPSHOT/$path/." "$path/"
            done
            git add data/facades/cities/tabarbour data/offline-world/tabarbour app/src/main/assets/cities/tabarbour
            if git diff --cached --quiet; then
              PUBLISHED=true
              break
            fi
            git commit -m "Import and package dedicated Tabarbour offline world data"
            if git push origin HEAD:main; then
              PUBLISHED=true
              break
            fi
            echo "main advanced during publish; reapplying the saved Tabarbour snapshot (attempt $attempt)"
          done
          if [ "$PUBLISHED" != true ]; then
            echo "Could not publish Tabarbour dataset after five safe retries" >&2
            exit 1
          fi
