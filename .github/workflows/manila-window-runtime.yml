name: Manila Facade Windows Runtime Shards
on:
  push:
    branches: [main]
    paths:
      - "tools/build_manila_stream_shards.py"
      - ".github/workflows/manila-window-runtime.yml"
      - "data/facades/cities/manila/layers/facade-windows-*.geojson"
      - "data/facades/cities/manila/facade-details-report.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manila-window-runtime
  cancel-in-progress: false
jobs:
  build-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Manila PBF decoder
        run: python -m pip install --disable-pip-version-check mapbox-vector-tile
      - name: Validate builder and saved window sources
        run: |
          python -m py_compile tools/build_manila_stream_shards.py
          python - <<'PY'
          import json
          from pathlib import Path
          city = Path("data/facades/cities/manila")
          report = json.loads((city / "facade-details-report.json").read_text(encoding="utf-8"))
          expected = report["outputs"]["facade-windows"]["window_surfaces"]
          chunks = sorted((city / "layers").glob("facade-windows-*.geojson"))
          if report.get("status") != "success" or expected <= 0 or len(chunks) != 34:
              raise SystemExit(f"Saved Manila windows incomplete: expected={expected}, chunks={len(chunks)}")
          print(f"Validated {len(chunks)} source chunks; {expected:,} saved window surfaces")
          PY
      - name: Fetch saved Manila PBF roads and POI supplements
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/saeedhub101/Adam-City.git Adam-City-source
          git -C Adam-City-source sparse-checkout set Manila/vector-tiles ermita/maps/generated
          test "$(find Adam-City-source/Manila/vector-tiles -type f -name '*.pbf' | wc -l)" -gt 0
          test -s Adam-City-source/ermita/maps/generated/ermita-public_services.csv
          test -s Adam-City-source/ermita/maps/generated/ermita-accessibility.csv
      - name: Build local-game Manila shards, including spatial window shards
        env:
          ADAM_CITY_MANILA_PBF: ${{ github.workspace }}/Adam-City-source/Manila/vector-tiles
          ADAM_CITY_POI_CSV: ${{ github.workspace }}/Adam-City-source/ermita/maps/generated/ermita-public_services.csv
          ADAM_CITY_ACCESS_CSV: ${{ github.workspace }}/Adam-City-source/ermita/maps/generated/ermita-accessibility.csv
        run: python -u tools/build_manila_stream_shards.py
      - name: Verify every window shard before publishing
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path("data/offline-city-stream/manila")
          city = Path("data/facades/cities/manila")
          report = json.loads((city / "facade-details-report.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = report["outputs"]["facade-windows"]["window_surfaces"]
          if manifest.get("window_surfaces") != expected:
              raise SystemExit(f"Window surface mismatch: {manifest.get('window_surfaces')} != {expected}")
          tiles = manifest.get("window_tiles") or []
          hashes = manifest.get("window_shard_sha256") or {}
          folder = root / "window-shards"
          if not tiles or len(tiles) != manifest.get("window_tile_count") or len(hashes) != len(tiles):
              raise SystemExit("Window tile index/hash manifest is incomplete")
          for tile in tiles:
              path = folder / (tile + ".jsonl.gz")
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing window shard: {path}")
              with gzip.open(path, "rt", encoding="utf-8") as stream:
                  first = json.loads(next(stream))
              if first.get("tags", {}).get("adam:facade_window") != "yes":
                  raise SystemExit(f"Invalid window shard record: {path}")
          print(f"VERIFIED {expected:,} window surfaces in {len(tiles):,} game-tile shards")
          PY
      - name: Commit runtime shards and manifest to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAPSHOT="$RUNNER_TEMP/manila-window-runtime"
          mkdir -p "$SNAPSHOT"
          cp -a data/offline-city-stream/manila/. "$SNAPSHOT/"
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/offline-city-stream/manila
            mkdir -p data/offline-city-stream/manila
            cp -a "$SNAPSHOT/." data/offline-city-stream/manila/
            git add data/offline-city-stream/manila
            if git diff --cached --quiet; then
              PUSHED=true
              break
            fi
            git commit -m "Build spatial Manila facade window runtime shards"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "Main advanced during Manila window publish; retrying (attempt $attempt)"
          done
          if [ "$PUSHED" != true ]; then
            echo "Could not publish Manila window shards after five safe retries" >&2
            exit 1
          fi
