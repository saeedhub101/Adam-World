name: Manila Facade Windows Source Validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manila-window-runtime.yml"
      - "data/facades/cities/manila/layers/facade-windows-*.geojson"
      - "data/facades/cities/manila/facade-details-report.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-saved-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate saved Manila window source files without generating legacy shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          city = Path("data/facades/cities/manila")
          report = json.loads((city / "facade-details-report.json").read_text(encoding="utf-8"))
          expected = report["outputs"]["facade-windows"]["window_surfaces"]
          chunks = sorted((city / "layers").glob("facade-windows-*.geojson"))
          if report.get("status") != "success" or expected <= 0 or len(chunks) != 34:
              raise SystemExit(f"Saved Manila windows incomplete: expected={expected}, chunks={len(chunks)}")
          actual = 0
          for path in chunks:
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("type") != "FeatureCollection" or not isinstance(data.get("features"), list):
                  raise SystemExit(f"Invalid saved window source: {path}")
              actual += len(data["features"])
          if actual != expected:
              raise SystemExit(f"Window source count mismatch: {actual} != {expected}")
          print(f"VALIDATED {actual:,} saved Manila window features in {len(chunks)} source chunks; no legacy runtime shards generated.")
          PY
