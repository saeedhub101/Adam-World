plugins {
    id 'com.android.application'
}

android {
    namespace 'com.explorer.world3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.explorer.world3d"
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty("VERSION_CODE") ?: "1").toString().toInteger()
        versionName "1.0.${versionCode}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
