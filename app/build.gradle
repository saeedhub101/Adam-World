plugins {
    id 'com.android.application'
}

def appVersionCode = (project.findProperty("VERSION_CODE") ?: "1").toString().toInteger()

android {
    namespace 'com.explorer.world3d'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.explorer.world3d"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("ADAM_WORLD_KEYSTORE_FILE")
            def keystorePassword = System.getenv("ADAM_WORLD_KEYSTORE_PASSWORD")
            def signingAlias = System.getenv("ADAM_WORLD_KEY_ALIAS")
            def signingPassword = System.getenv("ADAM_WORLD_KEY_PASSWORD")
            if (keystorePath) storeFile file(keystorePath)
            if (keystorePassword) storePassword keystorePassword
            if (signingAlias) keyAlias signingAlias
            if (signingPassword) keyPassword signingPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Package the existing Manila OSM extract and the preserved old_app Rizal Park tree inventory
// as app assets so the Manila local mode works without a first-run network download.
android.sourceSets.main.assets.srcDirs += [
    file("$rootDir/data/offline-world"),
    file("$rootDir/old_app/src/main/assets/data")
]

dependencies {
    implementation 'androidx.core:core:1.13.1'
}