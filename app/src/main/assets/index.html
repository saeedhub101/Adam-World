<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مدينة 3D</title>
<script src="vendor/three.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  #ui{position:absolute;left:8px;right:8px;top:8px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #ui>*{pointer-events:auto}
  .row{display:flex;gap:6px}
  #q{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:0;font-size:15px;background:rgba(255,255,255,.95)}
  .btn{padding:9px 12px;border-radius:12px;border:0;font-size:14px;background:rgba(15,15,25,.78);color:#fff;white-space:nowrap}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  #stick{position:absolute;left:18px;bottom:34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);z-index:5;touch-action:none}
  #knob{position:absolute;left:50px;top:50px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
  #acts{position:absolute;right:18px;bottom:40px;z-index:5;display:flex;flex-direction:column;gap:12px;align-items:center}
  .act{width:70px;height:70px;border-radius:50%;border:0;font-size:26px;background:rgba(15,15,25,.7);color:#fff;touch-action:none}
  .act.p{background:rgba(47,125,246,.9)}
  #msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(0,0,0,.78);color:#fff;padding:10px 16px;border-radius:12px;display:none;text-align:center;max-width:80%}
  #hud{position:absolute;right:18px;bottom:260px;z-index:5;color:#fff;font-size:18px;font-weight:bold;text-shadow:0 0 4px #000;display:none}
  #credit{position:absolute;left:8px;bottom:6px;z-index:4;color:#fff;font-size:10px;opacity:.75;text-shadow:0 0 3px #000}
  #loading{position:absolute;inset:0;z-index:10;background:rgba(10,12,20,.88);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;text-align:center;padding:20px}
  #imageryPanel{position:absolute;z-index:8;left:8px;right:8px;top:112px;max-height:58vh;overflow:auto;background:rgba(12,18,28,.96);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.4)}
  #imageryPanel h3{font-size:15px;margin:0 0 8px}#imageryPanel p{font-size:12px;line-height:1.55;margin:5px 0;color:#d8e0e9}#imageryPanel a{color:#9bd0ff}#imageryPanel .sourceLinks{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}#imageryPanel .sourceLinks a{background:#25364a;padding:7px 9px;border-radius:8px;text-decoration:none;font-size:12px}#imageryPanel .photo{display:flex;gap:9px;padding:8px 0;border-top:1px solid #344253;align-items:flex-start}#imageryPanel .photo img{width:96px;height:72px;object-fit:cover;border-radius:7px;background:#303944}#imageryPanel .photo div{min-width:0;font-size:12px;line-height:1.45}#imageryPanel .muted{color:#b7c1cc}#imageryToggle{background:#245b83}
  #cameraControls{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;display:flex;gap:5px;align-items:center;padding:6px;background:rgba(8,13,22,.78);border:1px solid rgba(255,255,255,.25);border-radius:14px;backdrop-filter:blur(8px);max-width:calc(100vw - 180px)}
  #cameraControls button{border:0;border-radius:9px;padding:8px 9px;background:#26384b;color:#fff;font-size:12px;white-space:nowrap}
  #cameraControls button.active{background:#176a9c;outline:1px solid #9bd0ff}
  #cameraControls .zoom{font-size:18px;min-width:34px;padding:5px 8px}
  @media(max-width:480px){#cameraControls{bottom:8px;max-width:calc(100vw - 160px);gap:3px;padding:4px}#cameraControls button{font-size:10px;padding:7px 6px}#cameraControls .zoom{min-width:29px}}
  /* Candidate photos stay in the repository review pipeline; never show detached photo cards in gameplay. */
  #imageryToggle,#imageryPanel{display:none!important}
</style>
</head>
<body>
<div id="ui">
  <div class="row">

    <button class="btn" id="time">☀️</button>

  </div>
  <div class="chips">
    <button class="btn" data-c="31.9516,35.9394">عمّان</button>
    <button class="btn" data-c="14.57655,120.98105">مانيلا</button>
    <button class="btn" data-c="13.7466,100.5347">بانكوك</button>
    <button class="btn" data-c="40.7580,-73.9855">نيويورك</button>
    <button class="btn" data-c="48.8606,2.3376">باريس</button>
    <button class="btn" data-c="25.1972,55.2744">دبي</button>
    <button class="btn" data-c="35.6595,139.7006">طوكيو</button>
    <button class="btn" data-c="51.5007,-0.1246">لندن</button>
    <button class="btn" data-c="24.7136,46.6753">الرياض</button>
    <button class="btn" data-c="30.0444,31.2357">القاهرة</button>
  </div>
</div>
<div id="cameraControls" aria-label="التحكم بالكاميرا">
  <button data-camera="street" class="active">شارع</button>

  <button data-camera="high">مرتفع</button>
  <button data-camera="drone">درون</button>

</div>
<section id="imageryPanel" aria-label="مصادر الصور الجغرافية"><h3>مصادر الصور المرتبطة بموقع المدينة</h3><p id="imageryStatus">سيتم البحث عن صور جوية وصور شوارع حول الموقع الحالي.</p><div class="sourceLinks" id="imageryLinks"></div><div id="imageryResults"></div><p class="muted">الصور القريبة مرشّحة للمراجعة فقط. لا تُسند إلى واجهة مبنى ولا تُستخدم كخامة ثلاثية الأبعاد إلا بعد التحقق من اتجاه التصوير ومطابقة المبنى والترخيص.</p></section>
<div id="stick"><div id="knob"></div></div>
<div id="acts">
  <button class="act" id="sprint">🏃</button>
  <button class="act" id="car">🚗</button>
</div>

<div id="msg"></div>

<div id="loading">جاري تحميل المدينة…</div>

<script>
const $=id=>document.getElementById(id);
function startupFailure(message){
  const box=$('loading');
  if(!box)return;
  box.textContent='تعذر بدء Adam World: '+(message||'حدث خطأ غير متوقع')+' — تحقق من ملفات التطبيق المحلية ثم أعد فتحه.';
  box.style.display='flex';
  box.style.pointerEvents='auto';
  box.onclick=()=>location.reload();
}
window.addEventListener('error',e=>{
  if(e&&e.message)startupFailure(e.message);
});
window.addEventListener('unhandledrejection',e=>{
  const reason=e&&e.reason;
  startupFailure(reason&&reason.message?reason.message:'تعذر تحميل بيانات المدينة');
});
function toast(t,ms){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms||2200);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function rnd(id,k){k=k||0;const x=Math.sin(id*12.9898+k*78.233)*43758.5453;return x-Math.floor(x);}

/* ---------- المشهد ---------- */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xcfe5f5,150,1100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.3,1800);
const hemi=new THREE.HemisphereLight(0xe6f0ff,0x777060,0.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(200,300,120);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
const aniso=Math.min(4,renderer.capabilities.getMaxAnisotropy());

/* ---------- التكستشرات ---------- */
function mkTex(c,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=aniso;if(rx){t.repeat.set(rx,ry);}return t;}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function noise(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*a)+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*5,1+Math.random()*5);}}

function facadeCanvas(){
  const c=cv(256,256),g=c.getContext('2d');
  g.fillStyle='#f4f4f4';g.fillRect(0,0,256,256);noise(g,256,256,1600,0.06);
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){
    const x=k*64,y=r*64;
    g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(x,y+61,64,3);
    const wx=x+13,wy=y+11,ww=38,wh=40;
    g.fillStyle='#dcdcdc';g.fillRect(wx-3,wy-3,ww+6,wh+6);
    const gr=g.createLinearGradient(0,wy,0,wy+wh);
    if(Math.random()<0.18){gr.addColorStop(0,'#cdbf9f');gr.addColorStop(1,'#a8987a');}
    else{gr.addColorStop(0,'#6b8aa6');gr.addColorStop(0.5,'#33475c');gr.addColorStop(1,'#1d2a38');}
    g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
    g.fillStyle='#ececec';g.fillRect(wx+ww/2-1,wy,2,wh);
    g.fillStyle='#b9b9b9';g.fillRect(wx-5,wy+wh+3,ww+10,3);
  }
  return c;
}
function facadeEmissive(){
  const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,256);
  const cols=['#ffd27a','#ffe9b0','#fff6d8','#9ec5ff'];
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){
    if(Math.random()<0.45){g.fillStyle=cols[Math.floor(Math.random()*cols.length)];g.fillRect(k*64+13,r*64+11,38,40);}
  }
  return c;
}
function glassCanvas(){
  const c=cv(256,256),g=c.getContext('2d');
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){
    const x=k*64,y=r*64;
    const gr=g.createLinearGradient(x,y,x+64,y+64);
    gr.addColorStop(0,'#9db8cf');gr.addColorStop(0.5,'#4f7392');gr.addColorStop(1,'#24394d');
    g.fillStyle=gr;g.fillRect(x,y,64,64);
    g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(x+6,y+4,10,56);
  }
  g.fillStyle='#2b3b49';
  for(let i=0;i<=4;i++){g.fillRect(i*64-1.5,0,3,256);g.fillRect(0,i*64-3,256,6);}
  return c;
}
function glassEmissive(){
  const c=cv(256,256),g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,256,256);
  for(let r=0;r<4;r++)for(let k=0;k<4;k++){if(Math.random()<0.35){g.fillStyle=Math.random()<0.3?'#bcd8ff':'#ffe3a0';g.fillRect(k*64+3,r*64+6,58,52);}}
  return c;
}
function roadCanvas(line){
  const c=cv(128,256),g=c.getContext('2d');
  g.fillStyle='#3b3c40';g.fillRect(0,0,128,256);noise(g,128,256,1400,0.18);
  if(line){
    g.fillStyle='#f1f1f1';g.fillRect(62,0,4,128);
    g.fillStyle='rgba(240,240,240,0.65)';g.fillRect(5,0,3,256);g.fillRect(120,0,3,256);
  }
  return c;
}
function sidewalkCanvas(){
  const c=cv(128,128),g=c.getContext('2d');
  g.fillStyle='#b4b0a7';g.fillRect(0,0,128,128);noise(g,128,128,500,0.1);
  g.strokeStyle='#8f8c84';g.lineWidth=2;g.strokeRect(0,0,128,128);
  return c;
}
const facadeTex=mkTex(facadeCanvas()),facadeEm=mkTex(facadeEmissive());
const glassTex=mkTex(glassCanvas()),glassEm=mkTex(glassEmissive());
const roadTexW=mkTex(roadCanvas(true)),roadTexN=mkTex(roadCanvas(false));
const swTex=mkTex(sidewalkCanvas());


const DS=THREE.DoubleSide;
// Building surfaces use OSM colour/material tags; no procedurally invented
// windows, facade patterns or night lights are painted onto real footprints.
const matB=new THREE.MeshLambertMaterial({vertexColors:true,side:DS});
const matG=matB;
const matRoadW=new THREE.MeshLambertMaterial({map:roadTexW,side:DS});
const matRoadN=new THREE.MeshLambertMaterial({map:roadTexN,side:DS});
const matSw=new THREE.MeshLambertMaterial({map:swTex,side:DS});
// Separate mapped OSM land-cover classes; no generic park-green overlay.
const matGrass=new THREE.MeshLambertMaterial({color:0x82945b,side:DS});
const matForest=new THREE.MeshLambertMaterial({color:0x496b43,side:DS});
const matScrub=new THREE.MeshLambertMaterial({color:0x777c4b,side:DS});
const matCrops=new THREE.MeshLambertMaterial({color:0x9b9860,side:DS});
const matBare=new THREE.MeshLambertMaterial({color:0x9a927f,side:DS});
const matSand=new THREE.MeshLambertMaterial({color:0xc4ad7d,side:DS});
const matWetland=new THREE.MeshLambertMaterial({color:0x687f69,side:DS});
const matWater=new THREE.MeshLambertMaterial({color:0x477f9b,side:DS});
const matLampHead=new THREE.MeshBasicMaterial({color:0x666666});
const matStreetPole=new THREE.MeshLambertMaterial({color:0x555b62}),matBusSign=new THREE.MeshLambertMaterial({color:0x1675b9}),matBusMark=new THREE.MeshBasicMaterial({color:0xffffff}),matShelter=new THREE.MeshLambertMaterial({color:0x606a73}),matStopSign=new THREE.MeshLambertMaterial({color:0xc92828}),matStopCenter=new THREE.MeshLambertMaterial({color:0xffffff}),matCrosswalk=new THREE.MeshBasicMaterial({color:0xf3f2e9,side:THREE.DoubleSide,depthWrite:false});
// Neutral fallback only where no mapped OSM land-cover polygon exists.
 // It is not presented as satellite/aerial ground truth.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),new THREE.MeshLambertMaterial({color:0x928b7e}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);

/* ---------- السماء والوقت ---------- */
const skyMat=new THREE.MeshBasicMaterial({side:THREE.BackSide,fog:false,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1400,16,12),skyMat);sky.renderOrder=-1;scene.add(sky);
const TIMES=[
 {n:'☀️',top:'#4f8fd6',hor:'#cfe5f5',fog:0xcfe5f5,hc:0xe6f0ff,hg:0x777060,hi:0.95,si:0.85,sc:0xffffff,sp:[200,300,120],em:0,lamp:0x666666,stars:false,fn:150,ff:1100},
 {n:'🌇',top:'#2f3f73',hor:'#f2a65e',fog:0xe9b087,hc:0xffd0a8,hg:0x504030,hi:0.65,si:0.8,sc:0xffa860,sp:[300,70,-100],em:0.35,lamp:0xffd9a0,stars:false,fn:120,ff:900},
 {n:'🌙',top:'#04060d',hor:'#16203a',fog:0x0d1426,hc:0x4a5f9a,hg:0x151820,hi:0.3,si:0.12,sc:0x7f9cff,sp:[-150,250,100],em:1,lamp:0xffe2a0,stars:true,fn:60,ff:600}];
let timeI=0;
function applyTime(i){
  const T=TIMES[i];timeI=i;
  const c=cv(4,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,T.top);gr.addColorStop(0.5,T.hor);gr.addColorStop(1,T.hor);
  g.fillStyle=gr;g.fillRect(0,0,4,256);
  const c2=cv(512,256),g2=c2.getContext('2d');g2.drawImage(c,0,0,512,256);
  if(T.stars){g2.fillStyle='#fff';for(let k=0;k<160;k++){g2.globalAlpha=0.4+Math.random()*0.6;g2.fillRect(Math.random()*512,Math.random()*120,1.5,1.5);}g2.globalAlpha=1;}
  if(skyMat.map)skyMat.map.dispose();
  skyMat.map=new THREE.CanvasTexture(c2);skyMat.needsUpdate=true;
  scene.fog.color.setHex(T.fog);scene.fog.near=T.fn;scene.fog.far=T.ff;
  hemi.color.setHex(T.hc);hemi.groundColor.setHex(T.hg);hemi.intensity=T.hi;
  sun.color.setHex(T.sc);sun.intensity=T.si;sun.position.set(T.sp[0],T.sp[1],T.sp[2]);
  matB.emissiveIntensity=T.em;matG.emissiveIntensity=T.em;matLampHead.color.setHex(T.lamp);
  $('time').textContent=T.n;
}
$('time').onclick=()=>applyTime((timeI+1)%TIMES.length);
$('update').onclick=()=>{if(window.Android&&Android.checkForUpdates)Android.checkForUpdates();else toast('التحقق من التحديثات متاح في تطبيق Android فقط');};
function onUpdateStatus(message){toast(message,4500);}

applyTime(0);

/* ---------- الإسقاط ---------- */
let LAT0=31.9516,LON0=35.9394,KX=111320*Math.cos(LAT0*Math.PI/180);const KY=111132;
function proj(lat,lon){return [(lon-LON0)*KX,-(lat-LAT0)*KY];}
function unproj(x,z){return [LAT0-z/KY,LON0+x/KX];}
let terrainGrid=null;
function terrainHeight(x,z){
  const g=terrainGrid;if(!g||!g.elevations_m)return 0;
  const b=g.bounds,rows=g.rows,cols=g.cols;
  const westX=(b.west-LON0)*KX,eastX=(b.east-LON0)*KX;
  const northZ=-(b.north-LAT0)*KY,southZ=-(b.south-LAT0)*KY;
  const fx=clamp((x-westX)/(eastX-westX)*(cols-1),0,cols-1);
  const fz=clamp((z-northZ)/(southZ-northZ)*(rows-1),0,rows-1);
  const x0=Math.floor(fx),z0=Math.floor(fz),x1=Math.min(cols-1,x0+1),z1=Math.min(rows-1,z0+1);
  const a=g.elevations_m[z0][x0],b0=g.elevations_m[z0][x1],c=g.elevations_m[z1][x0],d=g.elevations_m[z1][x1];
  const vals=[a,b0,c,d];if(vals.some(v=>!Number.isFinite(v)))return 0;
  const tx=fx-x0,tz=fz-z0;
  const v=(a*(1-tx)+b0*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
  return v-Number(g.base_elevation_m||0);
}
function addTerrainSurface(g){
  if(!g||!g.elevations_m)return;
  const pos=[],colors=[],indices=[],rows=g.rows,cols=g.cols,b=g.bounds,base=Number(g.base_elevation_m||0);
  const x0=(b.west-LON0)*KX,x1=(b.east-LON0)*KX,z0=-(b.north-LAT0)*KY,z1=-(b.south-LAT0)*KY;
  const valid=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const e=g.elevations_m[r][c],x=x0+(x1-x0)*c/(cols-1),z=z0+(z1-z0)*r/(rows-1);
    pos.push(x,Number.isFinite(e)?e-base:0,z);valid.push(Number.isFinite(e));
    const h=Number.isFinite(e)?e:base;
    const t=clamp((h-650)/500,0,1);
    const low=[0.48,0.43,0.32],high=[0.66,0.62,0.52];
    colors.push(low[0]*(1-t)+high[0]*t,low[1]*(1-t)+high[1]*t,low[2]*(1-t)+high[2]*t);
  }
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){
    const a=r*cols+c,b0=a+1,d=(r+1)*cols+c,e=d+1;
    if(valid[a]&&valid[d]&&valid[b0])indices.push(a,d,b0);
    if(valid[b0]&&valid[d]&&valid[e])indices.push(b0,d,e);
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));mesh.userData.terrain=true;cityGroup.add(mesh);
  ground.visible=false;
}

/* ---------- أدوات هندسية ---------- */
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function inPoly(x,z,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}return ins;}
function triangulate(P){
  try{const v=P.map(p=>new THREE.Vector2(p[0],p[1]));return THREE.ShapeUtils.triangulateShape(v,[]);}

const offlineTileCache=new Map();
const OFFLINE_TILE_CACHE_LIMIT=64;
async function readOfflineTile(slug,tile){
  const key=slug+'/'+tile.file;
  if(offlineTileCache.has(key)){
    const cached=offlineTileCache.get(key);
    offlineTileCache.delete(key);
    offlineTileCache.set(key,cached);
    return cached;
  }
  const payload=await readOfflineJson('cities/'+key);
  offlineTileCache.set(key,payload);
  while(offlineTileCache.size>OFFLINE_TILE_CACHE_LIMIT)
    offlineTileCache.delete(offlineTileCache.keys().next().value);
  return payload;
}

// Offline-first city data. The APK contains a compact spatial tile package
// generated from the versioned GeoJSON under data/facades/cities.
let offlineCatalogPromise = null;
async function readOfflineJson(path) {
  if (window.Android && typeof Android.readAssetText === 'function') {
    const raw = Android.readAssetText(path);
    if (!raw) throw new Error('الملف المحلي غير موجود: ' + path);
    try { return JSON.parse(raw); }
    catch (e) { throw new Error('ملف البيانات المحلية تالف: ' + path); }
  }
  const response = await fetch(path);
  if (!response.ok) throw new Error('تعذر قراءة البيانات المحلية: ' + response.status);
  return await response.json();
}
async function getOfflineCatalog() {
  if (!offlineCatalogPromise) offlineCatalogPromise = readOfflineJson('cities/catalog.json');
  return await offlineCatalogPromise;
}
function localMetersBetween(lat1, lon1, lat2, lon2) {
  const x = (lon1 - lon2) * 111320 * Math.cos(((lat1 + lat2) / 2) * Math.PI / 180);
  const z = (lat1 - lat2) * 111132;
  return Math.hypot(x, z);
}
async function loadOfflineArea(lat, lon, radiusMeters) {
  const catalog = await getOfflineCatalog();
  const cities = catalog.cities || [];
  if (!cities.length) throw new Error('سجل المدن المحلي فارغ');
  let selected = null, nearest = Infinity;
  for (const city of cities) {
    const d = localMetersBetween(lat, lon, city.center.lat, city.center.lon);
    if (d < nearest) { nearest = d; selected = city; }
  }
  const coverage = Number(selected.discovery_radius_m || 650);
  if (!selected || nearest > coverage + 180) {
    throw new Error('لا توجد بيانات محلية لهذه المنطقة. اختر إحدى المدن العشر المتاحة.');
  }
  const manifest = await readOfflineJson('cities/' + selected.slug + '/manifest.json');
  const kx = 111320 * Math.cos(manifest.center.lat * Math.PI / 180);
  const px = (lon - manifest.center.lon) * kx;
  const pz = -(lat - manifest.center.lat) * 111132;
  const chosen = (manifest.tiles || []).filter(tile => {
    const dx = px < tile.min_x ? tile.min_x - px : (px > tile.max_x ? px - tile.max_x : 0);
    const dz = pz < tile.min_z ? tile.min_z - pz : (pz > tile.max_z ? pz - tile.max_z : 0);
    return Math.hypot(dx, dz) <= radiusMeters;
  });
  if (!chosen.length) throw new Error('لا توجد قطاعات مبانٍ محلية ضمن نطاق التحميل الحالي');
  const elements = [];
  for (const tile of chosen) {
    const data = await readOfflineTile(selected.slug, tile);
    if (Array.isArray(data.elements)) elements.push(...data.elements);
  }
  if (!elements.length) throw new Error('قطاعات المدينة المحلية لا تحتوي على مبانٍ');
  let terrain=null;
  if(manifest.elevation_grid){
    try{terrain=await readOfflineJson('cities/'+selected.slug+'/'+manifest.elevation_grid);}
    catch(e){console.warn('Optional city terrain unavailable:',e.message);}
  }
  console.info('Adam World offline stream:', selected.slug, 'tiles:', chosen.length,
               'buildings:', elements.length, 'center distance:', Math.round(nearest) + 'm');
  return { elements: elements, city: selected, tileCount: chosen.length, terrain: terrain };
}

function bHeight(t,id){

  // (notably Burj Khalifa); honour it before falling back to storey estimates.
  const h=parseFloat(t.height||t['building:height']||t.maxheight||t['building:maxheight']);

  const lv=parseFloat(t['building:levels']);
  if(Number.isFinite(lv)&&lv>0)return Math.max(2.5,lv*3.2);
  // OSM has no measured height for this building: use a conservative,
  // deterministic massing estimate rather than inventing random storeys.
  const b=t.building||'yes';
  if(['garage','garages','shed','hut','carport'].includes(b))return 3.2;
  if(['house','detached','semidetached_house','bungalow','residential'].includes(b))return 6.5;
  if(['apartments','commercial','office','hotel','retail','hospital','university'].includes(b))return 10;

function pushFacadeWallPanel(acc,a,b,u0,u1,y0,y1,col,len){

    const bottom=windows[0].bottom,top=windows[0].top;
    pushFacadeWallPanel(acc,a,b,0,len,y0,bottom,col,len);
    pushFacadeWallPanel(acc,a,b,0,len,top,y1,col,len);

    for(const win of windows){

        // an earlier block consumes a global geometry cap.
        if(architecturalWindowCount>=24000||buildingWindowCount>=(robinsonsMall?96:18))break;
        if(utilitarian&&kind!=='warehouse'&&kind!=='industrial'&&wi%4!==0)continue;
        if(utilitarian&&(kind==='warehouse'||kind==='industrial')&&wi%3!==0)continue;

        const c=[mid[0]+tx*along+nx*0.055,cy,mid[2]+tz*along+nz*0.055];
        const fw=0.065,fd=0.10;

        for(const side of [-1,1]){
          const q=[c[0]+tx*side*(ww/2-fw/2),c[1],c[2]+tz*side*(ww/2-fw/2)];

function disposeGroup(g){

    if(o.userData&&o.userData.ownedTexture)o.userData.ownedTexture.dispose();
    if(o.userData&&o.userData.ownedMaterial&&o.material)o.material.dispose();

  }
  if(pedPaths.length){
    const sh=[0x3498db,0xe67e22,0x1abc9c,0x9b59b6,0xecf0f1,0xf39c12,0x95a5a6];
    for(let i=0;i<24;i++){
      const pp=pedPaths[Math.floor(Math.random()*pedPaths.length)];
      const m=makePerson(sh[Math.floor(Math.random()*sh.length)]);agentGroup.add(m);
      const off=pp.veh?(pp.w/2+1.6)*(Math.random()<0.5?1:-1):(Math.random()-0.5)*0.8;
      agents.push({kind:'ped',path:pp.path,off:off,s:Math.random()*pp.path.total,dir:Math.random()<0.5?1:-1,sp:1.1+Math.random()*0.7,m:m,ph:Math.random()*6});
    }
  }

  if(spawn){
    // Find a genuinely clear walking position beside a mapped street/path.
    // The old fixed (0,0) fallback could place the player inside a building.
    let best=null,bd=Infinity;
    for(const road of pedPaths){
      const path=road.path,step=Math.max(1,Math.floor(path.pts.length/160));
      for(let i=0;i<path.pts.length;i+=step){
        const s=path.cum[i],base=posAt(path,Math.min(s,path.total-0.2),0);
        const side=road.veh?road.w/2+1.7:0;
        const offsets=road.veh?[side,-side,side+1.0,-side-1.0]:[0,0.7,-0.7,1.4,-1.4];
        for(const offset of offsets){
          const p=posAt(path,Math.min(s,path.total-0.2),offset);
          if(blocked(p.x,p.z,0.62))continue;
          const d=Math.hypot(p.x,p.z);
          if(d<bd){bd=d;best={road:road,s:s,walk:p,roadPoint:base};}
        }
      }
    }
    if(best){
      const path=best.road.path;
      const direction=posAt(path,Math.min(best.s,path.total-0.2),0);
      const yaw=Math.atan2(direction.dx,direction.dz);
      S.px=best.walk.x;S.pz=best.walk.z;S.pyaw=yaw;
      S.cx=best.roadPoint.x;S.cz=best.roadPoint.z;S.cyaw=yaw;
    }else{
      // Last-resort clear-space search; never place the player at a known building centroid.
      let safe=null;
      for(let radius=0;radius<=180&&!safe;radius+=3){
        for(let a=0;a<Math.PI*2;a+=Math.PI/12){
          const x=Math.cos(a)*radius,z=Math.sin(a)*radius;
          if(!blocked(x,z,0.62)){safe={x,z};break;}
        }
      }
      S.px=safe?safe.x:0;S.pz=safe?safe.z:0;
      S.cx=S.px;S.cz=S.pz;S.pyaw=0;S.cyaw=0;
    }
    S.mode='walk';S.cv=0;S.camYaw=S.pyaw;
    camera.position.set(S.px,terrainHeight(S.px,S.pz)+3,S.pz);
  }
  $('loading').style.display='none';
  currentImageryCenter={lat,lon};
  renderImageryLinks(lat,lon);
  $('imageryStatus').textContent='بيانات المدينة محلية. البحث عن الصور اختياري ويبدأ فقط عند فتح هذه اللوحة.';
  // Imagery catalogues are optional and are queried only when the user opens the imagery panel.
}

let loading=false;
async function loadCity(lat,lon){
  loading=true;$('loading').style.display='flex';$('loading').textContent='جاري تحميل بيانات المدينة من التخزين المحلي…';
  try{
    await loadArea(lat,lon,true);
  }catch(e){
    const detail=e&&e.message?e.message:'خطأ غير معروف';
    $('loading').textContent='تعذر تحميل بيانات المدينة المحلية. '+detail+' — اضغط هنا لإعادة المحاولة.';
    $('loading').style.display='flex';
    $('loading').onclick=()=>{ $('loading').onclick=null; loadCity(lat,lon); };
  }finally{
    loading=false;
  }
}
let reloadRetryAfter=0;
async function reloadHere(){
  if(loading||Date.now()<reloadRetryAfter)return;
  loading=true;
  const ll=unproj(S.mode==='drive'?S.cx:S.px,S.mode==='drive'?S.cz:S.pz);
  try{
    await loadArea(ll[0],ll[1],false);
    toast('تم تحميل المنطقة الجديدة');
  }catch(e){
    reloadRetryAfter=Date.now()+15000;
    toast('تعذر تحميل القطاع المحلي: '+(e&&e.message?e.message:'خطأ في البيانات')+' — ستتم إعادة المحاولة');
  }finally{loading=false;}
}

/* ---------- واجهة ---------- */
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{const [la,lo]=b.dataset.c.split(',').map(Number);loadCity(la,lo);}));
async function search(){
  const q=$('q').value.trim().toLocaleLowerCase();if(!q)return;
  try{
    const catalog=await getOfflineCatalog();
    const matches=(catalog.cities||[]).filter(c=>
      c.name.toLocaleLowerCase()===q || c.slug.toLocaleLowerCase()===q ||
      c.name.toLocaleLowerCase().includes(q));
    if(matches.length===1){loadCity(matches[0].center.lat,matches[0].center.lon);return;}
    if(matches.length>1){toast('اكتب اسم المدينة كاملاً لتحديد الوجهة');return;}
    toast('البحث المحلي متاح للمدن العشر الموجودة في بيانات التطبيق');
  }catch(e){toast('تعذر قراءة فهرس المدن المحلي: '+e.message);}
}
$('go').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
$('loc').onclick=()=>{if(window.Android)Android.requestLocation();else toast('غير متاح');};
function onLocation(lat,lng){loadCity(lat,lng);}
function onLocationError(){toast('تعذر تحديد الموقع');}

/* عصا التحكم */
const stick=$('stick'),knob=$('knob');let stickId=null;
function updStick(e){
  const r=stick.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width/2*0.75;const m=Math.hypot(dx,dy);
  if(m>max){dx*=max/m;dy*=max/m;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';S.sx=dx/max;S.sy=-dy/max;
}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);updStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)updStick(e);});
const endStick=e=>{if(e.pointerId===stickId){stickId=null;S.sx=0;S.sy=0;knob.style.transform='translate(0,0)';}};
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);

/* تدوير الكاميرا */
const cvs=renderer.domElement;let lookId=null,lx=0,ly=0;
cvs.addEventListener('pointerdown',e=>{if(lookId===null){lookId=e.pointerId;lx=e.clientX;ly=e.clientY;cvs.setPointerCapture(e.pointerId);}});
cvs.addEventListener('pointermove',e=>{
  if(e.pointerId!==lookId)return;
  S.camYaw-=(e.clientX-lx)*0.006;S.camPitch=clamp(S.camPitch-(e.clientY-ly)*0.004,0.05,1.52);
  lx=e.clientX;ly=e.clientY;S.lastLook=performance.now();
});
const endLook=e=>{if(e.pointerId===lookId)lookId=null;};
cvs.addEventListener('pointerup',endLook);cvs.addEventListener('pointercancel',endLook);
const CAMERA_PRESETS={street:{distance:5.2,pitch:0.28},near:{distance:13,pitch:0.52},high:{distance:38,pitch:0.92},drone:{distance:105,pitch:1.48}};
function setCameraPreset(name){
  const p=CAMERA_PRESETS[name];if(!p)return;
  S.camDistance=p.distance;S.camPitch=p.pitch;
  document.querySelectorAll('[data-camera]').forEach(b=>b.classList.toggle('active',b.dataset.camera===name));
}
document.querySelectorAll('[data-camera]').forEach(b=>b.addEventListener('click',()=>setCameraPreset(b.dataset.camera)));
function changeZoom(factor){S.camDistance=clamp(S.camDistance*factor,3.2,180);}
$('zoomIn').onclick=()=>changeZoom(0.78);
$('zoomOut').onclick=()=>changeZoom(1.28);
cvs.addEventListener('wheel',e=>{e.preventDefault();changeZoom(Math.exp(e.deltaY*0.0012));},{passive:false});

const sp=$('sprint');
sp.addEventListener('pointerdown',e=>{S.sprint=true;sp.classList.add('p');sp.setPointerCapture(e.pointerId);});
const spOff=()=>{S.sprint=false;sp.classList.remove('p');};
sp.addEventListener('pointerup',spOff);sp.addEventListener('pointercancel',spOff);

$('car').onclick=()=>{
  if(S.mode==='walk'){
    const d=Math.hypot(S.px-S.cx,S.pz-S.cz);
    if(d<8){S.mode='drive';S.cv=0;ped.visible=false;toast('قيادة: العصا للتسارع والتوجيه',1800);}
    else{
      const fx=Math.sin(S.pyaw),fz=Math.cos(S.pyaw);
      const tries=[[fx*5,fz*5],[-fz*4,fx*4],[fz*4,-fx*4],[-fx*5,-fz*5]];
      let ok=false;
      for(const t of tries){const x=S.px+t[0],z=S.pz+t[1];if(!blocked(x,z,2.2)){S.cx=x;S.cz=z;S.cyaw=S.pyaw;S.cv=0;ok=true;break;}}
      toast(ok?'تم استدعاء السيارة، اضغط 🚗 للركوب':'لا توجد مساحة لاستدعاء السيارة');
    }
  }else{
    const rx=-Math.cos(S.cyaw),rz=Math.sin(S.cyaw);
    let x=S.cx+rx*2.6,z=S.cz+rz*2.6;
    if(blocked(x,z,0.5)){x=S.cx-rx*2.6;z=S.cz-rz*2.6;}
    if(blocked(x,z,0.5)){x=S.cx;z=S.cz;}
    S.px=x;S.pz=z;S.pyaw=S.cyaw;S.mode='walk';S.cv=0;ped.visible=true;
  }
};

/* ---------- الحلقة ---------- */
let last=performance.now(),lastCheck=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.1);last=now;
  if(!bldgs&&!agents)return;
  const mag=loading?0:Math.min(1,Math.hypot(S.sx,S.sy));

  if(S.mode==='walk'){
    if(mag>0.08){
      const fx=Math.sin(S.camYaw),fz=Math.cos(S.camYaw),rx=-Math.cos(S.camYaw),rz=Math.sin(S.camYaw);
      let dx=fx*S.sy+rx*S.sx,dz=fz*S.sy+rz*S.sx;const dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;
      const speed=(S.sprint?8.5:4.6)*mag;
      const nx=S.px+dx*speed*dt,nz=S.pz+dz*speed*dt;
      if(!blocked(nx,nz,0.45)){S.px=nx;S.pz=nz;}
      else if(!blocked(nx,S.pz,0.45))S.px=nx;
      else if(!blocked(S.px,nz,0.45))S.pz=nz;
      S.pyaw+=angDiff(S.pyaw,Math.atan2(dx,dz))*Math.min(1,dt*12);
      S.phase+=speed*dt*1.7;swing(ped,S.phase,0.8*Math.min(1,speed/4));
    }else swing(ped,0,0);
    ped.position.set(S.px,terrainHeight(S.px,S.pz),S.pz);ped.rotation.y=S.pyaw;
  }else{
    const thr=loading?0:S.sy;
    if(thr>0.1)S.cv+=thr*14*dt;
    else if(thr<-0.1)S.cv+=thr*(S.cv>0?24:8)*dt;
    else S.cv-=Math.sign(S.cv)*Math.min(Math.abs(S.cv),5*dt);
    S.cv=clamp(S.cv,-8,32);
    S.cyaw-=S.sx*1.7*dt*clamp(S.cv/5,-1,1);
    const fx=Math.sin(S.cyaw),fz=Math.cos(S.cyaw);
    const nx=S.cx+fx*S.cv*dt,nz=S.cz+fz*S.cv*dt;
    if(blocked(nx+fx*2.1,nz+fz*2.1,0.9)||blocked(nx-fx*2.1,nz-fz*2.1,0.9)||blocked(nx,nz,1.0)){S.cv=-S.cv*0.25;}
    else{S.cx=nx;S.cz=nz;}
    S.px=S.cx;S.pz=S.cz;
    $('hud').style.display='block';$('hud').textContent=Math.round(Math.abs(S.cv)*3.6)+' كم/س';
    if(performance.now()-S.lastLook>2500)S.camYaw+=angDiff(S.camYaw,S.cyaw)*Math.min(1,dt*2.5);
  }
  if(S.mode==='walk')$('hud').style.display='none';
  pcar.position.set(S.cx,terrainHeight(S.cx,S.cz),S.cz);pcar.rotation.y=S.cyaw;

  for(const a of agents){
    a.s+=a.dir*a.sp*dt;
    if(a.s>a.path.total){a.s=a.path.total;a.dir=-1;}else if(a.s<0){a.s=0;a.dir=1;}
    const o=a.off*(a.kind==='car'?a.dir:1);
    const p=posAt(a.path,a.s,a.kind==='car'?o:(a.dir>0?a.off:a.off));
    a.m.position.set(p.x,terrainHeight(p.x,p.z),p.z);a.m.rotation.y=Math.atan2(p.dx*a.dir,p.dz*a.dir);
    if(a.kind==='ped'){a.ph+=a.sp*dt*2.2;swing(a.m,a.ph,0.6);}
  }

  /* الكاميرا */
  const tx=S.mode==='drive'?S.cx:S.px,tz=S.mode==='drive'?S.cz:S.pz;
  const dist=S.camDistance*(S.mode==='drive'?1.6:1),th=1.55;
  const cp=Math.cos(S.camPitch),spn=Math.sin(S.camPitch);
  const terrainY=terrainHeight(tx,tz),dx=tx-Math.sin(S.camYaw)*dist*cp,dz=tz-Math.cos(S.camYaw)*dist*cp,dy=terrainY+th+dist*spn;
  const k=1-Math.exp(-dt*14);
  camera.position.x+=(dx-camera.position.x)*k;camera.position.y+=(Math.max(0.6,dy)-camera.position.y)*k;camera.position.z+=(dz-camera.position.z)*k;
  camera.lookAt(tx,terrainY+th,tz);
  sky.position.copy(camera.position);
  ground.position.x=Math.round(camera.position.x/13.3333)*13.3333;ground.position.z=Math.round(camera.position.z/13.3333)*13.3333;

  if(now-lastCheck>900){lastCheck=now;if(!loading&&Math.hypot(tx,tz)>220)reloadHere();}
  renderer.render(scene,camera);
}

applyTime(0);
loadCity(31.95165805,35.93939340);
requestAnimationFrame(frame);
</script>
